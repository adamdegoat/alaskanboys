<style>
/* ── Alaska ambient motion ── */
@keyframes hsSmoke{0%{opacity:.18;transform:translate(0,0)}50%{opacity:.5;transform:translate(3px,-6px)}100%{opacity:.18;transform:translate(0,0)}}
@keyframes hsAurora{0%,100%{opacity:.45;transform:translateX(0)}50%{opacity:.9;transform:translateX(26px)}}
@keyframes hsShimmer{0%{opacity:.25;transform:translateX(0)}50%{opacity:.6;transform:translateX(14px)}100%{opacity:.25;transform:translateX(0)}}
@keyframes hsGraze{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
@keyframes hsSoar{0%{transform:translate(0,0)}50%{transform:translate(70px,14px)}100%{transform:translate(0,0)}}
@keyframes townTruck{0%{transform:translate(0,0);opacity:0}8%{opacity:.9}92%{opacity:.9}100%{transform:translate(120px,18px);opacity:0}}
.hs-soar{transform-box:fill-box;animation:hsSoar 26s ease-in-out infinite}
.hs-smoke{transform-box:fill-box;transform-origin:bottom;animation:hsSmoke 5.5s ease-in-out infinite}
.hs-aurora{transform-box:fill-box;animation:hsAurora 14s ease-in-out infinite}
.hs-shimmer{animation:hsShimmer 7s ease-in-out infinite}
.hs-graze{transform-box:fill-box;transform-origin:center bottom;animation:hsGraze 6s ease-in-out infinite}

*{margin:0;padding:0;box-sizing:border-box}
:root{--above-hud:62px;--stage-bottom:96px}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;background:#020617}
/* World renders ABOVE the fixed bottom bars (HUD + collapsed feed drawer) so the
   beach + ocean band are never hidden behind them. --stage-bottom is measured live. */
#world{position:relative;width:100vw;height:calc(100vh - var(--stage-bottom));overflow:hidden}
#world-svg{position:absolute;inset:0;width:100%;height:100%;z-index:0;transform:translateY(calc(-1 * var(--world-shift,0px)))}
#stars{position:absolute;inset:0;width:100%;height:34%;pointer-events:none;z-index:2;opacity:0;transition:opacity 3s}
#world.night #stars,#world.dawn #stars{opacity:1}

/* Cloud animations */
@keyframes cloud-a{from{transform:translateX(0)}to{transform:translateX(1300px)}}
.cl1{animation:cloud-a 90s linear infinite}
.cl2{animation:cloud-a 115s linear infinite;animation-delay:-40s}
.cl3{animation:cloud-a 72s linear infinite;animation-delay:-22s}

/* Fire animations */
@keyframes flk{0%,100%{transform:scaleY(1) scaleX(1)}50%{transform:scaleY(1.22) scaleX(.9)}}
.fa{animation:flk .75s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.fb{animation:flk .55s ease-in-out infinite reverse;transform-box:fill-box;transform-origin:50% 100%}
.fc{animation:flk .42s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}

/* Wave animations */
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(500px)}}
.wa{animation:wv 13s linear infinite}
.wb{animation:wv 19s linear infinite reverse}
/* Gentle palm sway — pivots at each palm's crown (origin set inline, in viewBox units) */
@keyframes palmsway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
.palm-sway{transform-box:view-box;animation:palmsway 5.5s ease-in-out infinite}
/* Ambient birds drift slowly across the sky */
@keyframes birddrift{0%{transform:translate(0,0)}50%{transform:translate(46px,-9px)}100%{transform:translate(0,0)}}
.birds-drift{transform-box:view-box;animation:birddrift 24s ease-in-out infinite}
/* Leaves drifting down through the scene */
@keyframes leaffall{0%{transform:translate(0,0) rotate(0deg);opacity:0}8%{opacity:.9}90%{opacity:.85}100%{transform:translate(-46px,620px) rotate(240deg);opacity:0}}
.leaf-fall{transform-box:view-box;animation:leaffall linear infinite}
/* God-ray shafts breathe + sway very gently, as if the canopy stirs overhead */
@keyframes raypulse{0%,100%{opacity:.48;transform:skewX(-0.7deg)}50%{opacity:.68;transform:skewX(0.9deg)}}
#god-rays{transform-box:fill-box;transform-origin:50% 0;animation:raypulse 9s ease-in-out infinite}
/* Dust / pollen motes drifting inside the sunbeams (parent group gates day-only) */
@keyframes motedrift{0%{opacity:0;transform:translate(0,0)}18%{opacity:.7}50%{opacity:.4;transform:translate(7px,-15px)}82%{opacity:.6}100%{opacity:0;transform:translate(-4px,-30px)}}
.mote{transform-box:view-box;animation:motedrift 11s ease-in-out infinite}
/* Sun pools on the clearing floor breathe with the canopy (parent gates day-only) */
@keyframes dapplebreathe{0%,100%{opacity:.6}50%{opacity:1}}
.dapple{animation:dapplebreathe 9s ease-in-out infinite}
/* Heat-haze ribbons shimmer low over the clearing on hot/humid days */
@keyframes heatwobble{0%{opacity:0;transform:translateY(0)}30%{opacity:.16}50%{transform:translateY(-3px) scaleX(1.015)}70%{opacity:.13}100%{opacity:0;transform:translateY(-7px)}}
.heat-ribbon{transform-box:view-box;animation:heatwobble 6s ease-in-out infinite}
/* Fireflies near the firepit (parent group's opacity gates night-only visibility) */
@keyframes firefly{0%,100%{opacity:0;transform:translate(0,0)}25%{opacity:.95}50%{opacity:.35;transform:translate(7px,-9px)}75%{opacity:.85}}
.firefly{transform-box:view-box;animation:firefly 4.2s ease-in-out infinite}
/* Butterflies flutter (daytime ambient; group hidden at night via applySky) */
@keyframes flutter{0%{transform:translate(0,0) rotate(-2deg)}25%{transform:translate(14px,-12px) rotate(3deg)}50%{transform:translate(30px,2px) rotate(-3deg)}75%{transform:translate(12px,14px) rotate(2deg)}100%{transform:translate(0,0) rotate(-2deg)}}
.flutter{transform-box:view-box;animation:flutter 11s ease-in-out infinite}
@keyframes wingbeat{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.45)}}
.fly-wing{transform-box:fill-box;transform-origin:50% 50%;animation:wingbeat .32s ease-in-out infinite}
/* Distant waterfall cascade shimmer */
@keyframes waterfall{from{transform:translateY(0);opacity:.8}to{transform:translateY(5px);opacity:1}}
.fall1{transform-box:view-box;animation:waterfall .5s linear infinite alternate}
.fall2{transform-box:view-box;animation:waterfall .5s linear infinite alternate-reverse}
/* ── WEATHER: rain / storm + lightning, driven by S.world.weather ── */
#rain-layer{position:fixed;inset:0;z-index:22;pointer-events:none;opacity:0;transition:opacity .7s ease}
#rain-layer.on{opacity:1}
#rain-layer::before,#rain-layer::after{content:"";position:absolute;inset:-60% -15% -15%;will-change:transform}
#rain-layer::before{background-image:repeating-linear-gradient(100deg,rgba(200,222,236,.5) 0 1.5px,transparent 1.5px 10px);animation:rainfall .75s linear infinite}
#rain-layer::after{background-image:repeating-linear-gradient(100deg,rgba(200,222,236,.28) 0 1px,transparent 1px 16px);animation:rainfall 1.15s linear infinite;opacity:.7}
#rain-layer.storm{background:linear-gradient(rgba(9,18,26,.26),rgba(9,18,26,.34))}
#rain-layer.storm::before{background-image:repeating-linear-gradient(104deg,rgba(212,230,242,.62) 0 2px,transparent 2px 8px);animation-duration:.42s}
#rain-layer.storm::after{animation-duration:.66s;opacity:.85}
@keyframes rainfall{from{transform:translateY(-14%)}to{transform:translateY(14%)}}
#lightning{position:fixed;inset:0;z-index:23;pointer-events:none;background:#e6f0ff;opacity:0;mix-blend-mode:screen}
#lightning.on{animation:lightning 8s steps(1) infinite}
@keyframes lightning{0%,100%{opacity:0}2%{opacity:.62}2.6%{opacity:.06}3.2%{opacity:.5}3.8%{opacity:0}48.4%{opacity:.42}49%{opacity:0}}
/* Campfire smoke rising + drifting (shown only when the fire is lit) */
@keyframes smokerise{0%{transform:translate(0,0) scale(.45);opacity:0}18%{opacity:.5}100%{transform:translate(12px,-72px) scale(1.7);opacity:0}}
.smoke-rise{transform-box:view-box;animation:smokerise 4s ease-out infinite}
.smoke-rise.s2{animation-duration:5.4s;animation-delay:-1.8s}
.smoke-rise.s3{animation-duration:4.6s;animation-delay:-3.1s}
/* Fish/insect ripples on the river surface */
@keyframes ripple{0%{transform:scale(.2);opacity:0}20%{opacity:.6}100%{transform:scale(1.5);opacity:0}}
.ripple{transform-box:view-box;animation:ripple 4.5s ease-out infinite}
/* Dog (puppy) ears + tail — driven by applyDogExtras; smooth transitions + tail wag */
.dog-ear{transform-box:view-box;transition:transform .45s ease}
.dog-tail{transform-box:view-box;transition:transform .45s ease}
@keyframes tailwag{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}}
.dog-tail.wag{animation:tailwag .45s ease-in-out infinite}
.dog-tail.slow{animation:tailwag 1.5s ease-in-out infinite}

/* SVG transitions */
#sky-bg,#sun-group,#moon-group,#night-stars,#night-overlay,#sun-reflection{transition:opacity 2.5s ease}

/* ── ATMOSPHERE OVERLAYS (pure CSS, no JS/engine) ── */
/* Vignette: darken the corners to draw the eye to the centre of the island */
#vignette{position:absolute;inset:0;z-index:6;pointer-events:none;
  background:radial-gradient(120% 95% at 50% 42%,transparent 58%,rgba(2,6,23,.16) 84%,rgba(2,6,23,.42) 100%)}
/* Time-of-day colour wash: a soft tint that shifts with the cycle for cohesion */
#color-wash{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;
  mix-blend-mode:soft-light;transition:background 2.5s ease,opacity 2.5s ease}
#world.evening #color-wash{background:#fb923c;opacity:.5}
#world.morning #color-wash{background:#fdba74;opacity:.4}
#world.dawn    #color-wash{background:#f9a8d4;opacity:.45}
#world.night   #color-wash{background:#1e1b4b;opacity:.35}
#world.midday  #color-wash,#world.afternoon #color-wash{opacity:0}

/* ── DAY STAMP ── */
/* ── DAY HISTORY ── */
/* ── AUDIENCE VOTE PILL + PANEL ("sway, don't script") ── */
#vote-pill{position:fixed;top:22px;right:108px;z-index:35;display:flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;
  background:linear-gradient(135deg,rgba(251,191,36,.24),rgba(244,114,182,.2));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(251,191,36,.5);
  font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:800;letter-spacing:.4px;color:#fde68a;
  box-shadow:0 2px 14px rgba(0,0,0,.4);animation:votePulse 2.6s ease-in-out infinite;
  transition:transform .15s,border-color .2s}
#vote-pill:hover{transform:translateY(-1px);border-color:rgba(251,191,36,.85)}
#vote-pill.active{animation:none;background:linear-gradient(135deg,rgba(251,191,36,.42),rgba(244,114,182,.34));border-color:rgba(251,191,36,.9)}
@keyframes votePulse{0%,100%{box-shadow:0 2px 14px rgba(0,0,0,.4),0 0 0 0 rgba(251,191,36,.45)}
  50%{box-shadow:0 2px 14px rgba(0,0,0,.4),0 0 0 5px rgba(251,191,36,0)}}
#vote-pill .vp-dot{width:6px;height:6px;border-radius:50%;background:#fde68a;box-shadow:0 0 7px #fde68a}
/* dropdown panel — anchored under the pill (like the Days panel), warm gold "sway the island" palette */
#vote-panel{position:fixed;top:60px;right:108px;z-index:41;width:300px;max-width:calc(100vw - 24px);
  background:linear-gradient(180deg,rgba(26,16,34,.6),rgba(12,9,22,.66));
  backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);
  border:1px solid rgba(251,191,36,.34);border-radius:16px;
  box-shadow:0 20px 54px rgba(0,0,0,.6),0 0 26px rgba(251,191,36,.08);
  max-height:0;overflow:hidden;opacity:0;pointer-events:none;
  transition:max-height .34s cubic-bezier(.4,0,.2,1),opacity .22s ease}
#vote-panel::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;z-index:3;
  background:linear-gradient(90deg,transparent,rgba(251,191,36,.7),rgba(244,114,182,.5),transparent)}
#vote-panel.open{max-height:80vh;opacity:1;pointer-events:auto;overflow-y:auto}
.vp-inner{padding:15px 16px 15px}
.vp-eyebrow{font-family:'VT323',monospace;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(251,191,36,.62);margin-bottom:3px}
.vp-head{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:16px;letter-spacing:.01em;line-height:1.1;
  background:linear-gradient(180deg,#fff8ea 0%,#fde68a 58%,#f59e0b 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.vp-tag{font-size:10.5px;color:rgba(255,255,255,.5);font-style:italic;margin:3px 0 13px;line-height:1.45}
.vp-q{font-size:12px;font-weight:700;color:rgba(255,255,255,.92);margin-bottom:9px;letter-spacing:.01em}
.vp-opt{position:relative;display:block;width:100%;text-align:left;margin-bottom:8px;padding:10px 12px;border-radius:12px;
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.035);cursor:pointer;overflow:hidden;color:#fff;
  transition:border-color .15s,background .15s,transform .12s}
.vp-opt:hover{border-color:rgba(251,191,36,.55);transform:translateY(-1px)}
.vp-opt:disabled{cursor:default;transform:none}
.vp-opt.picked{border-color:rgba(251,191,36,.9);background:rgba(251,191,36,.09)}
.vp-bar{position:absolute;left:0;top:0;bottom:0;width:0;z-index:0;transition:width .55s cubic-bezier(.4,0,.2,1);
  background:linear-gradient(90deg,rgba(251,191,36,.22),rgba(244,114,182,.14))}
.vp-opt-label{position:relative;z-index:1;font-weight:800;font-size:12.5px;color:#fff7e6}
.vp-opt-desc{position:relative;z-index:1;font-size:10.5px;color:rgba(255,255,255,.55);margin-top:2px;line-height:1.35}
.vp-opt-pct{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:800;color:#fde68a;z-index:2}
.vp-voted{font-size:10.5px;color:rgba(110,231,160,.92);margin-top:4px;letter-spacing:.2px;font-weight:600}
.vp-hint{font-size:10.5px;color:rgba(255,255,255,.42);margin-top:4px}
.vp-inplay{margin-top:13px;padding:11px 12px;border-radius:11px;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.18);
  font-size:11px;color:rgba(255,255,255,.8);line-height:1.5}
.vp-ip-eyebrow{font-family:'VT323',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(251,191,36,.6);display:block;margin-bottom:3px}
.vp-inplay b{color:#fde68a;font-weight:800}
#day-hist-btn{
  position:fixed;top:22px;right:18px;z-index:35;
  display:flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:20px;
  background:rgba(255,255,255,.09);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.2);
  font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:700;
  color:rgba(255,255,255,.72);letter-spacing:.3px;
  cursor:pointer;white-space:nowrap;
  transition:background .2s,border-color .2s,color .2s,box-shadow .2s;
  box-shadow:0 2px 12px rgba(0,0,0,.35);
}
#day-hist-btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.38);color:#fff;box-shadow:0 2px 18px rgba(0,0,0,.45)}
#day-hist-btn.active{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.35);color:#fff}
#day-history-panel{
  position:fixed;top:66px;right:18px;left:auto;z-index:40;width:244px;
  background:rgba(4,8,22,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.08);border-radius:14px;
  max-height:0;overflow:hidden;opacity:0;pointer-events:none;
  transition:max-height .32s cubic-bezier(.4,0,.2,1),opacity .2s ease;
}
#day-history-panel.open{max-height:400px;opacity:1;pointer-events:auto}
.dhp-head{
  font-family:'Plus Jakarta Sans',sans-serif;font-size:9px;font-weight:800;
  letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.25);
  padding:11px 14px 9px;border-bottom:1px solid rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.dhp-back{
  background:none;border:none;font-family:'Plus Jakarta Sans',sans-serif;
  font-size:9px;font-weight:700;color:rgba(255,255,255,.25);
  cursor:pointer;letter-spacing:.5px;padding:0;transition:color .15s;
}
.dhp-back:hover{color:rgba(255,255,255,.6)}
.dhp-scroll{overflow-y:auto;max-height:350px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.06) transparent}
.dhp-chips{padding:8px 10px 10px;display:flex;flex-direction:column;gap:5px}
.dhp-chip{
  display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:9px;
  border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);
  font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:700;

}
.dhp-chip:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:rgba(255,255,255,.8)}
.dhp-chip.cur{border-color:rgba(34,197,94,.3);color:rgba(255,255,255,.75)}
.dhp-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;flex-shrink:0;animation:cdot 2s ease-in-out infinite}
.dhp-chip-meta{font-size:10px;color:rgba(255,255,255,.28);font-weight:500;margin-left:auto;white-space:nowrap}
.dhp-drama{font-size:13px;color:rgba(255,255,255,.7);line-height:1.57;font-style:italic;

#day-stamp{position:fixed;top:58px;left:16px;z-index:30;pointer-events:none;line-height:1.15}
#pulse{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:30;pointer-events:none;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-style:italic;font-weight:500;
  color:rgba(255,255,255,.78);letter-spacing:.2px;text-align:center;max-width:340px;line-height:1.4;

/* ── CHARACTERS ── */
.char{position:absolute;z-index:20;transform:translate(-50%,-100%);
  transition:left 2.8s cubic-bezier(.4,0,.2,1),top 2.8s cubic-bezier(.4,0,.2,1);cursor:pointer}
.char:hover{filter:drop-shadow(0 0 9px rgba(255,255,255,.42))}
.char-svg{display:block;margin:0 auto;transform-origin:50% 100%;filter:var(--cast-shadow,drop-shadow(0 6px 14px rgba(0,0,0,.65)));animation:bob 3s ease-in-out infinite}
.char-svg.sad{animation:bob-slow 3.8s ease-in-out infinite}
.char-svg.angry{animation:bob-tense 1.1s ease-in-out infinite}
/* feet stay PLANTED — gentle breathing (scaleY from the feet), never a lift, so nobody floats */
@keyframes bob{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.028)}}
@keyframes bob-slow{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.015)}}
@keyframes bob-tense{0%,100%{transform:scaleY(1) rotate(-.4deg)}50%{transform:scaleY(1.022) rotate(.4deg)}}
/* ── INTERACTION OVERLAYS ── */
.interact-overlay{position:absolute;z-index:19;transform:translate(-50%,-50%);pointer-events:none;transition:opacity .4s}
.char.sitting{margin-top:10px}
.nametag{font-size:7.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  margin:4px auto 0;padding:2px 6px;border-radius:20px;width:fit-content;white-space:nowrap;
  background:rgba(0,0,0,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.nametag:empty{display:none}  /* unnamed stray: hide tag until it's named */

/* ── SPEECH BUBBLES ── */
.bubble{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);
  background:rgba(10,18,32,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  color:#f1f5f9;padding:3px 6px;border-radius:7px;
  font-size:6.5px;font-weight:600;max-width:80px;min-width:48px;text-align:center;
  line-height:1.4;pointer-events:none;white-space:normal;z-index:25;transition:opacity .22s ease;
  border:1px solid rgba(255,255,255,.06);border-top-width:2px}
.bubble::after{display:none}
/* FOCUS MODE: while a character's stat card is open, fade the speech bubbles so the card stands clean & alone */
#world:has(.stat-card.tap-open) .bubble{opacity:0;pointer-events:none}
@media (hover:hover){#world:has(.char:hover) .bubble{opacity:0;pointer-events:none}}
.bubble-name{font-size:6px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;margin-bottom:2px}
.bubble-text{font-size:6.5px}
.bubble-text.dog-emote{font-size:15px;line-height:1}

/* ── BOTTOM FEED DRAWER ── */
#chat-panel{
  position:fixed;left:0;right:0;bottom:52px;
  height:44px;overflow:hidden;
  background:rgba(10,14,24,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:50;display:flex;flex-direction:column;
  border-top:1px solid rgba(255,255,255,.1);
  transition:height .38s cubic-bezier(.4,0,.2,1),
             box-shadow .38s ease;
}
#chat-panel.feed-open{
  height:52vh;
  box-shadow:0 -12px 40px rgba(0,0,0,.55);
  border-top-color:rgba(255,46,120,.35);
}
/* Drag pill */
#feed-pill{
  width:36px;height:4px;border-radius:4px;
  background:rgba(255,255,255,.18);
  margin:6px auto 0;flex-shrink:0;
  transition:background .2s
}
#chat-panel:hover #feed-pill,
#chat-panel.feed-open #feed-pill{background:rgba(255,46,120,.5)}
#chat-header{
  position:relative;
  padding:5px 14px 5px;font-family:'VT323',monospace;font-size:16px;color:#ff2d78;
  letter-spacing:2.5px;display:flex;align-items:center;justify-content:center;gap:7px;
  cursor:pointer;flex-shrink:0;user-select:none;
  border-bottom:1px solid rgba(255,255,255,.0);
  transition:border-color .38s
}
#chat-panel.feed-open #chat-header{border-bottom-color:rgba(255,255,255,.07)}
#chat-dot{width:6px;height:6px;border-radius:50%;background:#ff2d78;animation:cdot 2s ease-in-out infinite;flex-shrink:0}
@keyframes cdot{0%,100%{opacity:1}50%{opacity:.2}}
/* Absolutely center the ISLAND FEED label (on all widths) so the chevron's
   margin-left:auto can't push it left under the Island Oracle widget. */
#feed-label{display:inline-flex;align-items:center;gap:7px;position:absolute;left:50%;transform:translateX(-50%);pointer-events:none}
#chat-chevron{
  margin-left:auto;font-size:11px;color:rgba(255,255,255,.35);
  transition:transform .35s cubic-bezier(.4,0,.2,1),color .2s
}
#chat-panel.feed-open #chat-chevron{transform:rotate(180deg);color:rgba(255,46,120,.7)}
#chat-feed{flex:1;overflow-y:auto;padding:8px 12px 4px;display:flex;flex-direction:column;gap:5px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
#chat-feed::-webkit-scrollbar{width:3px}
#chat-feed::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.cl{font-family:'VT323',monospace;font-size:15px;line-height:1.3;word-break:break-word}
.cl.marcus{color:#c084fc}
.cl.ryan{color:#fb923c}
.cl.jade{color:#f472b6}
.cl.interaction{color:#fbbf24}
.cl-label{font-size:11px;letter-spacing:.8px;opacity:.78;text-transform:uppercase}
.cl-dialogue{color:#e2e8f0;font-size:13px;opacity:.9}
.cl-ts{font-family:'VT323',monospace;font-size:12px;color:rgba(255,255,255,.45);letter-spacing:1.2px;text-align:center;padding:4px 0 2px;text-transform:uppercase;background:rgba(255,255,255,.03);border-radius:4px;margin:2px 0}
.cl-msg{font-family:'VT323',monospace;font-size:14px;line-height:1.3;padding:1px 4px;word-break:break-word}
.cl-spk{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.cl-line{color:#e2e8f0;opacity:.9}
.cl-absent{font-family:'VT323',monospace;font-size:12px;padding:2px 4px;opacity:.55;font-style:italic;border-left:2px solid rgba(255,255,255,.08);margin:3px 0 4px;padding-left:7px}
.cl-absent-txt{color:#94a3b8}
.cl-time{font-family:'VT323',monospace;font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.6px;float:right;margin-left:6px;white-space:nowrap}
.cl-latest{background:rgba(255,45,120,.06);border-left:2px solid rgba(255,45,120,.32);padding-left:5px;margin-left:-2px;border-radius:0 4px 4px 0}
.cl-ts-latest{background:rgba(255,45,120,.11)!important;color:rgba(255,160,200,.85)!important;border:1px solid rgba(255,45,120,.22);border-radius:5px;padding-left:8px;padding-right:8px}
.cl-ts-rel{font-family:'Plus Jakarta Sans',sans-serif;font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:none;color:#ff7eb0;margin-left:7px;white-space:nowrap}

/* ── HUD ── */
#hud{position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(2,6,23,.93);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid rgba(255,255,255,.07);padding:0 1rem;
  display:flex;align-items:center;gap:.6rem;height:52px}
.hud-day{font-weight:800;color:rgba(255,255,255,.9);font-size:13px;flex-shrink:0}
.hud-sep{color:rgba(255,255,255,.2);font-size:11px}
#cycle-label{font-size:11px;color:rgba(255,255,255,.45);flex-shrink:0}

/* Status strip */
#status-strip{display:flex;align-items:center;gap:.3rem;font-size:10px;flex-shrink:0}
.stp{display:inline-flex;align-items:center;padding:.15rem .5rem;border-radius:7px;
  border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.22);
  font-weight:700;letter-spacing:.3px;text-transform:uppercase;transition:all .4s}
.stp.running{color:#fbbf24;border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.1);animation:spulse 1s ease-in-out infinite}
.stp.done{color:#4ade80;border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.07)}
.stp.current{color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.09)}
@keyframes spulse{0%,100%{opacity:1}50%{opacity:.5}}
.stp-arr{color:rgba(255,255,255,.12);font-size:9px}

/* Tiny status info */
#status-info{font-size:9px;color:rgba(255,255,255,.6);white-space:nowrap;flex-shrink:0;line-height:1.3;letter-spacing:.2px}
#status-info span{color:rgba(255,255,255,.85)}
#status-msg{font-size:9px;color:rgba(255,255,255,.3);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}

/* Buttons */
.hud-actions{display:flex;align-items:center;gap:.45rem;margin-left:auto;flex-shrink:0}
#story-btn{display:inline-flex;align-items:center;gap:.2rem;padding:.28rem .7rem;
  border-radius:18px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.5);font-size:11px;font-weight:700;letter-spacing:.3px;
  text-transform:uppercase;text-decoration:none;transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif}
#story-btn:hover{border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.85);background:rgba(255,255,255,.09)}
/* a one-time invite glow drawing first-time visitors to the full story archive */
@keyframes storyNudge{0%,100%{box-shadow:0 0 0 0 rgba(246,181,61,0);border-color:rgba(255,255,255,.1)}
  50%{box-shadow:0 0 0 5px rgba(246,181,61,.16);border-color:rgba(246,181,61,.55)}}
#story-btn.nudge{animation:storyNudge 2.1s ease-in-out infinite;color:rgba(255,255,255,.8)}
/* the "· updated Nh ago" recency tag appended to the latest-pulse banner */
.pulse-age{color:rgba(246,181,61,.85);font-weight:700;white-space:nowrap}

/* ── MOBILE ── */
@media(max-width:768px){
  html,body{overflow-x:auto;overflow-y:hidden}
  /* Reserve the bottom bars here too: height drives width (10/6 aspect) for the
     horizontal-scroll layout, so the beach/ocean clears the bottom UI on mobile. */
  #world{width:calc((100dvh - var(--stage-bottom)) * 10 / 6);height:calc(100dvh - var(--stage-bottom))}
  /* HUD: 3-row layout — cycle strip + timing visible on mobile */
  #status-msg{display:none}
  #hud{padding:5px .75rem 4px;height:auto;flex-wrap:wrap;align-content:flex-start;gap:3px .3rem}
  .hud-actions{order:1}
  #status-strip{display:flex;flex-basis:100%;order:10;gap:.2rem}
  #status-info{display:block;flex-basis:100%;order:11}
  .stp{font-size:8px;padding:.1rem .3rem}
  .stp-arr{font-size:8px}
  /* Push chat panel above the now-taller HUD. */
  #chat-panel{bottom:var(--above-hud)}
  /* roomier tap targets on touch screens (UX audit #3) */
  #story-btn{padding:.5rem .7rem;font-size:10px;min-height:38px}
  #res-hud{flex-flow:row wrap!important;justify-content:flex-end!important;max-width:128px;align-items:flex-end}
  #res-hud .res-pill{min-height:32px;padding:6px 8px}
  #chat-header{min-height:44px}
  .bubble{max-width:82px;padding:3px 6px}
  .bubble-text{font-size:7.5px}
  #pulse{top:78px;font-size:11px;max-width:78vw;color:rgba(255,255,255,.85)}
  #scene-line{font-size:10.5px;width:78vw;color:rgba(255,255,255,.85)}
  /* no hover on touch — show structure names faintly so they're not invisible */
  .struct-label{color:rgba(255,255,255,.6)}
  #day-hist-btn{top:14px;right:12px;padding:5px 10px;font-size:10px}
  #vote-pill{top:14px;right:88px;padding:5px 11px;font-size:10px}
  #vote-panel{top:48px;left:12px;right:12px;width:auto;max-width:none}
  #day-stamp{left:13px;top:50px}
  #day-history-panel{top:52px;right:12px;width:220px}
  /* res-hud now anchors bottom-right via the base rule on all sizes */
  .stat-card{display:none}
  .stat-card.tap-open{display:block;opacity:1;transform:translateY(0)}
  .stat-card.right,.stat-card.left{left:50%;transform:translateX(calc(-50% + var(--sc-shift,0px)));right:auto}
  .stat-card.tap-open.right,.stat-card.tap-open.left{transform:translateX(calc(-50% + var(--sc-shift,0px)))}
  .stat-card.tap-open.below{transform:translateX(calc(-50% + var(--sc-shift,0px)))}
  /* Feed drawer taller on mobile */
  #chat-panel.feed-open{height:62vh}
}

/* ── HOVER STAT CARD ── */
.stat-card{
  position:absolute;bottom:110%;pointer-events:none;z-index:80;
  width:230px;max-width:84vw;background:rgba(6,10,18,.94);border-radius:12px;
  padding:12px 14px;opacity:0;transform:translateY(6px);
  transition:opacity .18s ease,transform .18s ease;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font-family:'Plus Jakarta Sans',sans-serif;line-height:1.4;white-space:normal;
  box-shadow:0 14px 40px rgba(0,0,0,.6)
}
.char:hover .stat-card{opacity:1;transform:translateY(0)}
.stat-card.right{left:90%;transform:translateY(6px)}
.stat-card.left{right:90%;transform:translateY(6px)}
.char:hover .stat-card.right{transform:translateY(0)}
.char:hover .stat-card.left{transform:translateY(0)}
/* below variant — card drops down when character is near top of screen */
.stat-card.below{bottom:auto;top:105%;transform:translateY(-6px)}
.char:hover .stat-card.below{transform:translateY(0)}
.stat-card.below.right{transform:translateY(-6px)}
.stat-card.below.left{transform:translateY(-6px)}
.char:hover .stat-card.below.right,.char:hover .stat-card.below.left{transform:translateY(0)}
.sc-name{font-size:17px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.sc-mood{font-size:13px;color:rgba(255,255,255,.45);letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase}
.sc-cond{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:7px;margin-bottom:8px}
.sc-cond-injured{background:rgba(248,113,113,.16);color:#fca5a5;border:1px solid rgba(248,113,113,.35)}
.sc-cond-sick{background:rgba(192,132,252,.16);color:#d8b4fe;border:1px solid rgba(192,132,252,.35)}
.sc-section{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:2px}
.sc-row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.sc-label{font-size:12px;color:rgba(255,255,255,.4);width:68px;text-transform:uppercase;letter-spacing:.3px;flex-shrink:0}
.sc-bar{flex:1;height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.sc-fill{height:100%;border-radius:3px}
.sc-val{font-size:12px;color:rgba(255,255,255,.5);width:22px;text-align:right;flex-shrink:0}
.sc-bond{font-size:12.5px;color:rgba(255,255,255,.72);margin-bottom:2px}
/* ── character-snapshot rows (the visitor-friendly card) ── */
.sc-role{font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.6px;text-transform:uppercase;margin:-1px 0 7px}
.sc-bio{font-size:12px;color:rgba(255,255,255,.62);line-height:1.5;margin-bottom:9px}
.sc-line{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}
.sc-key{font-size:10px;color:rgba(255,255,255,.32);letter-spacing:1px;text-transform:uppercase;flex:0 0 52px}
.sc-now{font-size:12.5px;color:rgba(255,255,255,.85);line-height:1.45;flex:1}
.sc-bonds{margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:3px}

/* ── STRUCTURES LAYER ── */
#structures-layer{position:absolute;inset:0;pointer-events:none;z-index:5;transform:translateY(calc(-1 * var(--world-shift,0px)))}
.struct{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;text-align:center;line-height:1;cursor:default}
.struct-svg{display:block;filter:var(--struct-shadow,drop-shadow(0 3px 8px rgba(0,0,0,.6)));transition:transform .2s ease}
.struct:hover .struct-svg{transform:scale(1.12)}
.struct-label{font-size:8px;color:rgba(255,255,255,.0);white-space:nowrap;margin-top:2px;
  font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;letter-spacing:.3px;
  text-shadow:0 1px 4px rgba(0,0,0,1);display:block;transition:color .18s ease;
  background:rgba(0,0,0,.45);padding:1px 5px;border-radius:4px;backdrop-filter:blur(3px)}
.struct:hover .struct-label{color:rgba(255,255,255,.75)}
.struct-cond{width:30px;height:3px;border-radius:2px;background:rgba(0,0,0,.45);margin:1px auto 0;overflow:hidden}
.struct-cond-fill{height:100%;border-radius:2px}
.struct.discovery .struct-svg{filter:drop-shadow(0 0 6px rgba(251,191,36,.6)) drop-shadow(0 3px 8px rgba(0,0,0,.5))}

/* ── RESOURCES HUD ── */
#res-hud{position:fixed;bottom:calc(var(--stage-bottom) + 8px);right:12px;z-index:30;pointer-events:auto;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
#fire-chip{position:fixed;bottom:calc(var(--stage-bottom) + 118px);right:12px;z-index:30;pointer-events:none;display:none;align-items:center;gap:4px;
  background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:3px 7px;font-family:'Plus Jakarta Sans',sans-serif;font-size:8px;font-weight:700;letter-spacing:.4px}
#fire-chip.lit{color:#fbbf24;border-color:rgba(251,191,36,.35)}
#fire-chip.out{color:#93a3b8}
.res-pill{display:flex;align-items:center;gap:3px;background:rgba(0,0,0,.35);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  border-radius:14px;padding:3px 7px 3px 6px;border:1px solid rgba(255,255,255,.06);
  cursor:pointer;user-select:none;min-height:18px;
  transition:background .15s,border-color .15s}
.res-pill:hover,.res-pill.rp-active{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.18)}
.res-pill-icon{font-size:9px}
.res-pill-val{font-size:8px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;min-width:13px;text-align:right}
/* Resource detail card */
#res-card{
  width:min(220px,calc(100vw - 36px));position:absolute;right:0;bottom:100%;margin-bottom:8px;z-index:31;
  background:rgba(4,8,22,.92);border:1px solid rgba(255,255,255,.1);border-radius:12px;
  overflow:hidden;max-height:0;opacity:0;pointer-events:none;
  transition:max-height .32s cubic-bezier(.4,0,.2,1),opacity .22s ease;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 8px 28px rgba(0,0,0,.6)}
#res-card.open{max-height:240px;opacity:1;pointer-events:auto}
.rc-inner{padding:13px 14px}
.rc-header{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.rc-icon{font-size:18px}
.rc-name{flex:1;font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.75)}
.rc-val{font-size:16px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif}
.rc-trend{font-size:14px;font-weight:700;margin-left:1px}
.rc-bar-wrap{height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-bottom:10px}
.rc-bar-fill{height:100%;border-radius:3px}
.rc-status{font-size:11px;color:rgba(255,255,255,.62);line-height:1.55;margin-bottom:7px}
.rc-mention{font-size:10px;color:rgba(255,255,255,.36);line-height:1.5;font-style:italic;
  border-top:1px solid rgba(255,255,255,.06);padding-top:7px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rc-who{display:block;margin-top:3px;font-style:normal;font-size:9px;
  letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.22)}


/* (Island Oracle widget styles removed — the Oracle runs in the engine but is no longer shown on screen.) */
</style>

/* ── Generate the spruce forests (depth bands behind + framing the homestead) ── */
(function(){
  function spruce(x, yb, s){
    const w1=0.18*s,w2=0.10*s,w3=0.30*s,w4=0.18*s,w5=0.44*s,t1=0.62*s,t2=0.32*s;
    return `M ${x} ${yb-s} L ${x-w1} ${yb-t1} L ${x-w2} ${yb-t1} L ${x-w3} ${yb-t2} L ${x-w4} ${yb-t2} L ${x-w5} ${yb} L ${x+w5} ${yb} L ${x+w4} ${yb-t2} L ${x+w3} ${yb-t2} L ${x+w2} ${yb-t1} L ${x+w1} ${yb-t1} Z`;
  }
  function fill(id, specs){ const g=document.getElementById(id); if(!g) return;
    g.insertAdjacentHTML('beforeend', specs.map(p=>`<path d="${spruce(p.x,p.y,p.s)}"/>`).join('')); }
  const far=[], mid=[], near=[];
  for(let x=-10;x<1010;x+=26){ far.push({x:x+(x%3-1)*5, y:340+(x%4), s:18+(x%5)*3}); }
  for(let x=-10;x<1010;x+=40){ mid.push({x:x+(x%5-2)*6, y:356+(x%3)*2, s:26+(x%6)*4}); }
  [[40,560,118],[95,600,134],[10,520,96],[150,580,104],
   [965,560,122],[915,600,138],[995,520,100],[860,592,112]].forEach(([x,y,sz])=>near.push({x,y,s:sz}));
  fill('treeline-far', far); fill('treeline-mid', mid); fill('treeline-near', near);
})();
</script>

// ── SGT TIME ─────────────────────────────────────────────
const RUN_HOURS = [7,12,18,23]
const CYCLE_NAMES = {7:'morning',11:'midday',15:'afternoon',18:'evening',22:'night'}

function getSGT() {
  const now = new Date()
  return new Date(now.getTime() + now.getTimezoneOffset()*60000 + 8*3600000)
}

function skyFromHour(h) {
  if(h>=22.5||h<7) return 'night'
  if(h<11.5) return 'morning'
  if(h<15)   return 'midday'
  if(h<18.5) return 'afternoon'
  return 'evening'
}

function fmtTime(sgt) {
  const h=sgt.getHours(), m=String(sgt.getMinutes()).padStart(2,'0')
  const ap=h>=12?'pm':'am', dh=h%12||12
  return `${dh}:${m}${ap}`
}

const RUN_MINUTES = [{h:7,m:0},{h:11,m:30},{h:15,m:0},{h:18,m:30},{h:22,m:30}]
function nextRun(sgt) {
  const total=sgt.getHours()*60+sgt.getMinutes()
  let nr=RUN_MINUTES.find(r=>r.h*60+r.m>total)
  if(!nr) nr={h:RUN_MINUTES[0].h+24,m:RUN_MINUTES[0].m}
  const diff=nr.h*60+nr.m-total, dh=Math.floor(diff/60), dm=diff%60
  const h24=nr.h%24, ap=h24>=12?'pm':'am', h12=h24%12||12
  const mStr=nr.m>0?`:${String(nr.m).padStart(2,'0')}`:':00'
  return { time:`${h12}${mStr}${ap}`, cd:dh>0?`${dh}h ${dm}m`:`${dm}m` }
}

// ── Directional sun-shadows, tuned SOFT for diffuse jungle light (zero engine cost) ──
// Light filters down from the upper-right (matches the #color-wash + sun). Under canopy the
// light is diffuse, so casts are shorter, blurrier and fainter than Tropicana's hard beach sun.
function applySunShadow(sgt) {
  const world = document.getElementById('world'); if (!world) return
  const h = sgt.getHours() + sgt.getMinutes() / 60
  const noon = 13, halfDay = 6.5
  const isDay = h > 6.3 && h < 19.7
  if (isDay) {
    const alt = Math.max(0, 1 - Math.abs(h - noon) / halfDay)   // 0 at horizon → 1 at noon
    const low = 1 - alt
    const cdx = -(1 + low * 15), cdy = 5 + low * 2, cbl = 9 + low * 12, ca = (0.42 - low * 0.12).toFixed(2)
    world.style.setProperty('--cast-shadow',
      `drop-shadow(0 5px 6px rgba(0,0,0,.4)) drop-shadow(${cdx.toFixed(1)}px ${cdy.toFixed(1)}px ${cbl.toFixed(1)}px rgba(8,14,8,${ca}))`)
    const sdx = -(1 + low * 13), sdy = 3 + low * 2, sbl = 7 + low * 10, sa = (0.44 - low * 0.1).toFixed(2)
    world.style.setProperty('--struct-shadow',
      `drop-shadow(${sdx.toFixed(1)}px ${sdy.toFixed(1)}px ${sbl.toFixed(1)}px rgba(8,14,8,${sa}))`)
  } else {
    world.style.setProperty('--cast-shadow', 'drop-shadow(0 5px 8px rgba(0,0,0,.5)) drop-shadow(0 3px 11px rgba(2,6,18,.32))')
    world.style.setProperty('--struct-shadow', 'drop-shadow(0 3px 10px rgba(2,6,18,.48))')
  }
}

function applySky(sky) {
  document.getElementById('sky-bg')?.setAttribute('fill',`url(#sky-${sky})`)
  const isNight=sky==='night'||sky==='dawn'
  document.getElementById('sun-group')?.setAttribute('opacity',isNight?'0':'1')
  document.getElementById('sun-reflection')?.setAttribute('opacity',isNight?'0':'.85')
  document.getElementById('moon-group')?.setAttribute('opacity',isNight?'1':'0')
  document.getElementById('moon-halo-c')?.setAttribute('opacity',isNight?'1':'0')
  document.getElementById('night-stars')?.setAttribute('opacity',isNight?'1':'0')
  // Aurora ribbons + the distant town's lit windows only at night
  document.getElementById('aurora')?.setAttribute('opacity', isNight?'1':'0')
  document.querySelector('.town-light')?.setAttribute('opacity', isNight?'1':'0')
  const fireLit = !!(S.world && S.world.fire && S.world.fire.lit)
  document.getElementById('fire-glow')?.setAttribute('opacity', fireLit ? (isNight?'1':'0.4') : '0')
  document.getElementById('fireflies')?.setAttribute('opacity',isNight?'1':'0')
  // Sun shafts only break through in daylight; soften the haze at night.
  const gr=document.getElementById('god-rays'); if(gr) gr.style.display=isNight?'none':''
  const isDusk=sky==='evening'; if(gr&&isDusk) gr.style.display=''
  const dm=document.getElementById('dust-motes'); if(dm) dm.style.display=isNight?'none':''
  const gd=document.getElementById('ground-dapple'); if(gd) gd.style.display=isNight?'none':''
  // Butterflies only flit about in daylight
  const bf=document.getElementById('butterflies'); if(bf) bf.style.display=isNight?'none':''
  document.getElementById('night-overlay')?.setAttribute('opacity',isNight?'0.3':'0')
  // Low ground fog thickens at dawn, lingers a little into morning
  document.getElementById('dawn-fog')?.setAttribute('opacity', sky==='dawn'?'0.6':sky==='morning'?'0.32':'0')
  drawStars(isNight)
  document.getElementById('world').className=isNight?'night':sky
  applySeason()
}

// ── SEASON re-skin: winter lays snow over the clearing; summer/spring clear it. ──
function applySeason(){
  const sn = (S.world && S.world.season && S.world.season.name) || 'summer'
  const winter = sn==='winter'
  document.getElementById('snow-ground')?.setAttribute('opacity', winter?'1':'0')
  document.getElementById('winter-extras')?.setAttribute('opacity', winter?'1':'0')
  document.getElementById('fall-tint')?.setAttribute('opacity', sn==='fall'?'0.5':'0')
  document.getElementById('spring-tint')?.setAttribute('opacity', sn==='spring'?'0.35':'0')
  // fall + winter green up the clearing less; tint handled via class below
  const w=document.getElementById('world')
  if(w){ ['summer','fall','winter','spring'].forEach(x=>w.classList.toggle('season-'+x, x===sn)) }
  applyBuildStage()
}
// Cabin repair rig shows while the cabin is being worked on; hides once it's finished (high condition, no active cabin build).
function applyBuildStage(){
  const st = ((S.world&&S.world.structures)||[]).find(s=>s.id==='cabin')
  const b = S.world && S.world.build
  const working = (st && (st.condition==null || st.condition < 85)) || (b && /cabin/.test(b.project||''))
  document.getElementById('cabin-wip')?.setAttribute('opacity', working ? '1' : '0')
}

// Engine-driven weather: read S.world.weather (already produced each cycle) and show
// rain / storm + lightning in the browser. Zero engine/Haiku cost.
function applyWeather(weather){
  const w=(weather||'').toLowerCase()
  const storm=/storm|thunder|monsoon|squall|gale|deluge|lightning/.test(w)
  const rain=storm||/rain|drizzle|shower|downpour|drip|pour|wet/.test(w)
  const rl=document.getElementById('rain-layer'); const lg=document.getElementById('lightning')
  if(rl){ rl.classList.toggle('on',rain); rl.classList.toggle('storm',storm) }
  if(lg) lg.classList.toggle('on',storm)
  // the river swells + muddies in a storm; the mud takes a wet sheen in any rain
  const ff=document.getElementById('river-flood'); if(ff) ff.style.display=storm?'':'none'
  document.getElementById('wet-ground')?.setAttribute('opacity', storm?'0.26':rain?'0.17':'0')
  // Heat shimmer only on a hot/humid, dry, daylit clearing
  const hot=/hot|heat|scorch|blazing|humid|sweltering|sultry|muggy/.test(w)
  const hh=document.getElementById('heat-haze')
  if(hh){
    // gate off the actual rendered sky (applySky runs first this tick and sets the night class)
    const night = document.getElementById('world')?.classList.contains('night')
    hh.style.display = (hot && !rain && !night) ? 'inline' : 'none'
  }
}

  applySunShadow(sgt)
  applyWeather(S.world && S.world.weather)
  const completedToday = new Set(S.feed.filter(e=>e.day===(S.world?.day||1)&&e.type!=='birth').map(e=>e.cycle))
  ALL_STEPS.forEach(s=>{
    const el=document.getElementById('stp-'+s); if(!el) return
    el.classList.remove('current','done')

// Horizontal cast-centering scroll. The scroll container varies by browser — when <body>
// has overflow-x:auto IT becomes the scroller (and window.scrollTo is a no-op), so set the
// scroll on window AND body AND html to cover every case.
function scrollWorldX(x){
  x=Math.max(0,Math.round(x))
  try{ window.scrollTo(x, window.scrollY||0) }catch(e){}
  document.body.scrollLeft=x; document.documentElement.scrollLeft=x
}

// Vertical placement of the sliced world art. The art is wider-than-tall (10:6), so on
// wide screens it overflows vertically and must be cropped. We push it UP to reveal the
// beach/ocean at the bottom, but CAP the top crop at MOUNTAIN_SAFE (just above the NE
// cliff peak at viewBox y≈160) so the mountain is never sliced off. Any leftover overflow
// then trims a little ocean instead. Returns the screen-px offset of viewBox y=0.
const MOUNTAIN_SAFE = 150
function worldYOffset(vh, scale) {
  const cropVB = Math.max(0, 600 - vh/scale)      // total vertical overflow, in viewBox units
  return -Math.min(cropVB, MOUNTAIN_SAFE) * scale  // shift up, but never past the mountain peak
}
function svgToViewport(sx, sy) {
  // On mobile the #world element is wider than the viewport (getWorldWidth, ~1190px) and
  // scrolls horizontally; the SVG scene fills that full width. So the char's left% MUST be
  // computed against the WORLD width it's positioned in — not window.innerWidth — or the
  // coords desync from the scene art and separation inflates (characters fly off-screen).
  const vw = isMobile() ? getWorldWidth() : window.innerWidth
  const vh = stageH()
  const scale=Math.max(vw/1000, vh/600)
  const offX=(vw-1000*scale)/2, offY=worldYOffset(vh, scale)
  return {left:((offX+sx*scale)/vw*100)+'%', top:((offY+sy*scale)/vh*100)+'%'}
}

function toPos(x, y, waypoint) {
  if (waypoint && WAYPOINTS[waypoint]) {
    const {sx,sy}=WAYPOINTS[waypoint]
    return svgToViewport(sx, sy)
  }
  const safeMaxPct = 90
  const leftPct = 5 + (x / 100) * (safeMaxPct - 5)
  return {left: leftPct+'%', top:(48+(y/100)*32)+'%'}
}

// Keep a tapped-open stat card fully on-screen: if a character near the edge pushes the
// centered card off the viewport, nudge it back in with a shift var (mobile only).
function clampStatCard(sc){
  if(!sc) return
  sc.style.setProperty('--sc-shift','0px')
  requestAnimationFrame(()=>{
    const r=sc.getBoundingClientRect(), m=8
    let shift=0
    if(r.left<m) shift=m-r.left
    else if(r.right>window.innerWidth-m) shift=(window.innerWidth-m)-r.right
    sc.style.setProperty('--sc-shift', Math.round(shift)+'px')
  })
}

function fmtSGT(ts) {
  if(!ts) return ''
  const t = ts.split('T')[1]
  if(!t) return ''
  const [hStr, mStr] = t.split(':')
  let h = parseInt(hStr), m = parseInt(mStr)
  const ap = h >= 12 ? 'PM' : 'AM'
  h = h % 12 || 12
  return `${h}:${String(m).padStart(2,'0')} ${ap}`
}

function cycleLabel(e) {

  return `Day ${e.day||1} · ${time || CYCLE_HOUR[e.cycle]||e.cycle||''}`

function separateChars(positions) {
  const MIN = 65
  const SEAT = 28   // interacting couples stay intimate, but never perfectly stacked — seat them side-by-side
  // Pairs with an active interaction are kept close (SEAT gap) instead of pushed fully apart (MIN).
  // Without this they'd stack exactly when the narrator puts both at the same waypoint.
  const interacting = new Set()
  Object.keys(S.chars).forEach(cid=>{
    const iw = S.chars[cid]?.interaction?.with
    if (iw) interacting.add([cid,iw].sort().join('_'))
  })
  for(let iter=0; iter<25; iter++) {
    for(let i=0; i<positions.length; i++) {
      for(let j=i+1; j<positions.length; j++) {
        if (Math.abs(positions[j].py - positions[i].py) > 45) continue   // different rows/levels — never shove vertically
        const isPair = interacting.has([positions[i].id,positions[j].id].sort().join('_'))
        const minDist = isPair ? SEAT : MIN
        const dx=positions[j].px - positions[i].px
        const adist=Math.abs(dx)
        if(adist < minDist) {
          // separate HORIZONTALLY only — never vertically — so each figure keeps its waypoint's
          // grounded height and its feet can't drift off the ground when several cluster.
          const push=(minDist-adist)/2
          const dir=adist>0.5?(dx>0?1:-1):(isPair?1:(Math.cos(i*2.4)>=0?1:-1))
          positions[i].px -= dir*push
          positions[j].px += dir*push
        }
      }
    }
  }
  // clamp to safe zone — x across island, y to ground band only
  const W=getWorldWidth(), H=stageH()
  positions.forEach(p=>{
    p.px=Math.max(W*0.05, Math.min(W*0.90, p.px))
    p.py=Math.max(H*0.40, Math.min(H*0.90, p.py))
  })
  return positions
}

function nudgeBubbles(positions) {
  const GAP = 8           // min clear space between any two bubbles
  const BODY_HALF = 10    // half-width of a character body
  // Measure each bubble's REAL rendered size from the DOM (never guess a constant —
  // the rendered width varies with text length and breakpoint, so a fixed value
  // misses near-miss overlaps). Fall back only if the element isn't laid out yet.
  const dim = {}
  positions.forEach(p=>{
    const el = document.getElementById('bubble-'+p.id)
    dim[p.id] = { w: (el && el.offsetWidth) || 90, h: (el && el.offsetHeight) || 50 }
  })
  const offsets = {}
  positions.forEach(p=>{ offsets[p.id] = 0 })
  // Pass 1: bubble-vs-bubble horizontal separation, using each pair's true widths
  for(let i=0; i<positions.length; i++) {
    for(let j=i+1; j<positions.length; j++) {
      const a = positions[i], b = positions[j]
      const absDx = Math.abs(b.px - a.px)
      const dy = Math.abs(b.py - a.py)
      const needed = (dim[a.id].w + dim[b.id].w) / 2 + GAP
      if(absDx < needed && dy < 80) {
        const shift = (needed - absDx) / 2
        const leftFirst = a.px <= b.px
        offsets[a.id] += leftFirst ? -shift : shift
        offsets[b.id] += leftFirst ? shift : -shift
      }
    }
  }
  // Pass 2: single pass — push each bubble clear of every other character's body
  for(let i=0; i<positions.length; i++) {
    for(let j=0; j<positions.length; j++) {
      if(i===j) continue
      const clear = dim[positions[i].id].w / 2 + BODY_HALF + 2  // bubble half + body half + gap
      const bx = positions[i].px + offsets[positions[i].id]
      const dist = bx - positions[j].px
      if(Math.abs(dist) < clear) {
        offsets[positions[i].id] += dist >= 0 ? (clear - dist) : -(clear + dist)
      }
    }
  }
  positions.forEach(p=>{
    const b = document.getElementById('bubble-'+p.id)
    if(b) b.style.marginLeft = offsets[p.id] + 'px'
  })
  // Vertical stagger: 2D collision avoidance using each bubble's real measured size.
  // Horizontal overlap is a true rectangle test on measured widths, so two bubbles
  // can never visually overlap regardless of where characters move next cycle.
  // CRITICAL: each bubble's CSS bottom is relative to its OWN character's feet (py),
  // so two characters at different py have different screen baselines. We must run the
  // collision test in absolute SCREEN space — otherwise a stack offset can be cancelled
  // out by the characters' py difference and the bubbles land at the same height.
  const H = stageH()
  const sorted = [...positions].sort((a,b) => (a.px+offsets[a.id]) - (b.px+offsets[b.id]))
  const placed = []
  sorted.forEach(p => {
    const bx = p.px + offsets[p.id]
    const el = document.getElementById('bubble-'+p.id)
    const w = dim[p.id].w
    const ph = dim[p.id].h + GAP
    const ground = H - p.py          // char feet, measured from stage bottom (screen space)
    let bot = ground + 70, clear = false  // bubble baseline in screen space
    while(!clear) {
      clear = true
      for(const q of placed) {
        const xOverlap = Math.abs(bx - q.bx) < (w + q.w) / 2 + GAP
        // horizontal overlap + vertical overlap (rectangle test, screen space)
        if(xOverlap && !(bot >= q.bot + q.h || bot + ph <= q.bot)) {
          bot = q.bot + q.h   // jump directly above q
          clear = false; break
        }
      }
    }
    placed.push({bx, bot, h: ph, w})
    el.style.bottom = (bot - ground) + 'px'  // convert screen baseline back to per-character CSS bottom
  })
}

// ── INTERACTION RENDERING ────────────────────────────────────
function renderInteractions(positions) {
  document.querySelectorAll('.interact-overlay').forEach(e=>e.remove())
  const world = document.getElementById('world')
  const processed = new Set()

  Object.keys(S.chars).forEach(cid=>{
    const c = S.chars[cid]
    const el = document.getElementById('char-'+cid)
    if (!el) return

    // Reset state classes and inline transforms
    el.classList.remove('sitting')
    el.querySelector('.char-svg')?.style.removeProperty('transform')

    const intr = c.interaction
    if (!intr?.with || !intr?.state) return
    const other = intr.with, state = intr.state
    if (!S.chars[other]) return

    const myPos  = positions.find(p=>p.id===cid)
    const othPos = positions.find(p=>p.id===other)
    if (!myPos || !othPos) return

    const iAmLeft = myPos.px <= othPos.px

    if (state === 'back_to_back') {
      const svg = el.querySelector('.char-svg')
      if (svg && iAmLeft) svg.style.transform = 'scaleX(-1)'
    }
    if (state === 'sitting_together') el.classList.add('sitting')
    if (state === 'comforting') {
      const svg = el.querySelector('.char-svg')
      if (svg) svg.style.transform = iAmLeft ? 'rotate(7deg)' : 'rotate(-7deg)'
    }

    const pairKey = [cid,other].sort().join('_')
    if (processed.has(pairKey)) return
    processed.add(pairKey)

    // Use the SAME world dimensions the character px/py were computed against in
    // updateWorld (mobile world is wider than the viewport, H is the stage height),
    // otherwise the hand/log overlay drifts off the couple on mobile.
    const W=isMobile()?getWorldWidth():window.innerWidth, H=stageH()
    const midX=(myPos.px+othPos.px)/2
    const midY=(myPos.py+othPos.py)/2 - 34

    let inner = ''
    if (state === 'holding_hands') {
      inner = `<svg width="22" height="20" viewBox="0 0 20 18" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 16Q2 11 2 6Q2 2.5 5.5 2.5Q7.5 2.5 10 5.5Q12.5 2.5 14.5 2.5Q18 2.5 18 6Q18 11 10 16Z" fill="rgba(249,168,212,.92)"/>
      </svg>`
    } else if (state === 'sitting_together') {
      inner = `<svg width="30" height="10" viewBox="0 0 30 10" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="2" width="28" height="6" rx="3" fill="rgba(146,64,14,.55)"/>
        <ellipse cx="15" cy="8" rx="13" ry="3" fill="rgba(120,53,15,.35)"/>
      </svg>`
    }
    if (inner) {
      const div = document.createElement('div')
      div.className = 'interact-overlay'
      div.style.left = (midX/W*100)+'%'
      div.style.top  = (midY/H*100)+'%'
      div.innerHTML  = inner
      world.appendChild(div)
    }
  })
}

let _dynamicTiles = {}

async function loadDynamicTiles() {
  try {
    const r = await fetch('data/svg_library.json?v=' + Date.now())
    if(r.ok) {
      const lib = await r.json()
      _dynamicTiles = lib.tiles || {}
    }
  } catch {}
}

function getTile(type) {
  if(_dynamicTiles[type]) return _dynamicTiles[type]
  if(SEED_TILES[type])    return SEED_TILES[type]
  return SEED_TILES['default']
}

function updateFireChip() {
  const el = document.getElementById('fire-chip'); if(!el) return
  const fire = S.world?.fire
  if(!fire){ el.style.display='none'; return }
  const lit = !!fire.lit
  el.style.display = 'flex'
  el.className = lit ? 'lit' : 'out'
  el.innerHTML = lit ? '🔥 FIRE LIT' : '🌑 FIRE OUT'
  // Scene flames only burn when the fire is actually lit (the stone ring always stays).
  // The night glow is handled in applySky (gated on fire.lit).
  const ff = document.getElementById('fire-flames')
  if(ff){
    ff.setAttribute('display', lit ? '' : 'none')
    // Flames scale with the real fuel level — a dying fire visibly shrinks.
    const fuel = (typeof fire.fuel === 'number') ? fire.fuel : 8
    ff.style.transformBox = 'fill-box'; ff.style.transformOrigin = '50% 100%'
    ff.style.transform = lit ? `scale(${Math.max(0.5, Math.min(1.3, 0.5 + fuel / 14)).toFixed(2)})` : ''
  }
  document.getElementById('fire-smoke')?.setAttribute('display', lit ? '' : 'none')
}

// ── CAMP STORES: the clearing is an honest readout of the survival sim. Firewood, drying
//    food, and the water vessel grow/shrink with the live resource numbers (zero engine cost). ──
function renderCampStores() {
  const R = (S.world && S.world.resources) || {}
  // firewood stack (left of the fire) — count tracks wood
  const wood = Math.max(0, R.wood ?? 0)
  const nLogs = Math.round(Math.min(7, wood / 6))
  const bx = 470, by = 476
  const slots = [[0,0],[11,0],[22,0],[-11,0],[5.5,-7],[16.5,-7],[11,-14]]
  const log = (x,y) => `<g transform="translate(${bx+x} ${by+y})"><circle r="5" fill="#6b4f2a"/><circle r="5" fill="none" stroke="#3f2d18" stroke-width="1.1"/><circle r="2" fill="#856544"/><path d="M0 -5 L0 5 M-3.4 -3.4 L3.4 3.4" stroke="#5c4327" stroke-width=".7" opacity=".55"/></g>`
  let wp = nLogs > 0 ? `<ellipse cx="${bx+6}" cy="${by+4}" rx="26" ry="5" fill="#1c130a" opacity=".4"/>` : ''
  for (let i = 0; i < nLogs; i++) wp += log(slots[i][0], slots[i][1])
  const wpEl = document.getElementById('woodpile'); if (wpEl) wpEl.innerHTML = wp

  // fish drying on a line (by the lean-to) — count tracks food
  const food = Math.max(0, R.food ?? 0)
  const nFish = Math.round(Math.min(4, food / 14))
  const lx0 = 634, lx1 = 690
  let fc = `<line x1="${lx0}" y1="418" x2="${lx0}" y2="398" stroke="#6b4f2a" stroke-width="2.4" stroke-linecap="round"/>`
         + `<line x1="${lx1}" y1="416" x2="${lx1}" y2="398" stroke="#6b4f2a" stroke-width="2.4" stroke-linecap="round"/>`
         + `<line x1="${lx0}" y1="400" x2="${lx1}" y2="400" stroke="#cdd98a" stroke-width="1" opacity=".7"/>`
  for (let i = 0; i < nFish; i++) {
    const fx = nFish === 1 ? (lx0+lx1)/2 : lx0 + 9 + i * ((lx1 - lx0 - 18) / (nFish - 1))
    fc += `<g transform="translate(${fx.toFixed(1)} 400)"><line x1="0" y1="0" x2="0" y2="5" stroke="#9c8a6a" stroke-width=".7"/><g transform="translate(0 9)"><ellipse cx="0" cy="0" rx="5.5" ry="2.6" fill="#9aa7ad"/><ellipse cx="-1" cy="-.6" rx="3.4" ry="1.3" fill="#c2ccd1" opacity=".7"/><path d="M5 0 L9 -2.4 L8.4 0 L9 2.4 Z" fill="#7c8b92"/><circle cx="-3.2" cy="-.4" r=".7" fill="#1c1c1f"/></g></g>`
  }
  const fcEl = document.getElementById('food-cache'); if (fcEl) fcEl.innerHTML = fc

  // collected-water vessel (right of camp) — fill level tracks water
  const water = Math.max(0, Math.min(100, R.water ?? 0))
  const vx = 706, vy = 450, vw = 18, vh = 28, fillH = (vh - 4) * (water / 100)
  const ws = `<ellipse cx="${vx+vw/2}" cy="${vy+vh+2}" rx="13" ry="4" fill="#1c130a" opacity=".4"/>`
    + `<rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" rx="3" fill="#3f2d18"/>`
    + (water > 1 ? `<rect x="${vx+2}" y="${(vy+vh-2-fillH).toFixed(1)}" width="${vw-4}" height="${fillH.toFixed(1)}" rx="2" fill="#22a3b3" opacity=".85"/>`
                 + `<ellipse cx="${vx+vw/2}" cy="${(vy+vh-2-fillH).toFixed(1)}" rx="${(vw-4)/2}" ry="1.5" fill="#5fded6" opacity=".7"/>` : '')
    + `<rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" rx="3" fill="none" stroke="#5c4327" stroke-width="1.5"/>`
    + `<line x1="${vx}" y1="${vy+9}" x2="${vx+vw}" y2="${vy+9}" stroke="#5c4327" stroke-width="1" opacity=".55"/>`
    + `<line x1="${vx}" y1="${vy+19}" x2="${vx+vw}" y2="${vy+19}" stroke="#5c4327" stroke-width="1" opacity=".55"/>`
  const wsEl = document.getElementById('water-store'); if (wsEl) wsEl.innerHTML = ws
}

// ── VEHICLE STATE: the Cayenne is a finite reserve. As the story strips it for parts,
//    the truck visibly dismantles — and it STAYS that way. The Onewheel vanishes if it's
//    cannibalised for its battery. Reads world.cayenne.stripped[] + world.onewheel. ──
function renderVehicleState() {
  const cay = (S.world && S.world.cayenne) || {}
  const stripped = Array.isArray(cay.stripped) ? cay.stripped : []
  const has = k => stripped.includes(k)
  // Use explicit 'inline'/'none' (not '') — the overlay groups carry a display="none" SVG
  // attribute, and an empty inline style would let that attribute win and keep them hidden.
  const show = (id, on) => { const el = document.getElementById(id); if (el) el.style.display = on ? 'inline' : 'none' }
  // parts that simply disappear when taken
  const HIDE = { mirror:'cay-mirror', snorkel:'cay-snorkel', lightbar:'cay-lightbar', tent:'cay-tent', spare:'cay-spare', wheel:'cay-wheel' }
  for (const k in HIDE) show(HIDE[k], !has(k))
  // a pulled wheel reveals the bare hub propped on logs
  show('cay-wheel-gone', has('wheel'))
  // overlays revealed when the engine bay or a door is opened up / stripped
  show('cay-hood-open', has('hood') || has('battery'))
  show('cay-door-removed', has('door') || has('seat'))
  // the Onewheel is gone once cannibalised (battery taken) or otherwise removed
  const ow = (S.world && S.world.onewheel) || {}
  show('onewheel', !(ow.present === false || ow.stripped === true))
}

function renderStructures() {
  const layer = document.getElementById('structures-layer')
  if(!layer) return
  const structs = [
    ...(S.world.structures||[]).filter(s => !s.baked),
    ...(S.world.discoveries||[]).map(d=>({...d, _isDisc:true}))
  ]
  layer.innerHTML = structs.map(s => {
    const tileKey = s._isDisc ? 'discovery' : s.type
    const tile    = getTile(tileKey)
    const label   = s.label || s.name || ''
    const cond = (!s._isDisc && typeof s.condition==='number') ? s.condition : null
    const condBar = (cond!==null && cond < 95)
      ? `<div class="struct-cond"><div class="struct-cond-fill" style="width:${Math.max(0,cond)}%;background:${cond>=60?'#4ade80':cond>=30?'#fbbf24':'#f87171'}"></div></div>`
      : ''
    return `<div class="struct${s._isDisc?' discovery':''}" style="left:${s.x}%;top:${s.y}%${cond!==null&&cond<40?';opacity:.7':''}">
      <svg class="struct-svg" viewBox="0 0 60 60" width="44" height="44" xmlns="http://www.w3.org/2000/svg">${tile}</svg>
      ${condBar}
      <span class="struct-label">${label}</span>
    </div>`
  }).join('')
}

let _activeRes = null

function buildResCardContent(k) {
  const res  = S.world?.resources      || {}
  const prev = S.world?.resources_prev || {}
  const val  = typeof res[k]==='number' ? res[k] : 0
  const prevVal = typeof prev[k]==='number' ? prev[k] : val

  const STATUS = {
    food:     ['Critically low — someone needs to hunt urgently.',   'Getting scarce. Finding food should be a priority.',  'Enough to keep everyone fed for now.'],
    water:    ['Dangerously low. Dehydration is a real risk.',       'Running short. Fresh water needs to be found soon.',  'Enough fresh water for now.'],
    wood:     ['Almost none left. No building until more is found.', 'Low supply. One build would nearly exhaust it.',      'Enough wood to build something if needed.'],
    medicine: ['Critically low. One illness could be very serious.', 'Very little left. Use it carefully.',                'Enough to handle minor injuries for now.'],
  }
  const tier = val<=20 ? 0 : val<=40 ? 1 : 2
  const statusLine = (STATUS[k]||['','Low.','Sufficient.'])[tier]

  const diff = val - prevVal
  const trend = diff>0 ? '↑' : diff<0 ? '↓' : '→'
  const trendCol = diff>0 ? '#4ade80' : diff<0 ? '#f87171' : 'rgba(255,255,255,.28)'

  const KEYS = {
    food:['food','eat','hunt','fish','fruit','hungry','starv','meal'],
    water:['water','drink','thirst','well','spring','rain','dehydr'],
    wood:['wood','timber','build','chop','tree','log','plank'],
    medicine:['medicine','heal','herb','sick','injur','hurt','wound'],
  }
  const kws = KEYS[k]||[]
  const mention = [...(S.feed||[])].reverse().find(e=>{
    const t=((e.thought||'')+(e.action||'')+(e.description||'')).toLowerCase()
    return kws.some(w=>t.includes(w))
  })
  const mentionHtml = mention
    ? `<div class="rc-mention">"${(mention.thought||mention.action||mention.description||'').slice(0,80)}"<span class="rc-who">${(mention.character||'someone')[0].toUpperCase()+(mention.character||'someone').slice(1)} · Day ${mention.day} ${mention.cycle||''}</span></div>`
    : ''

  const ICONS = {food:'🥫',water:'💧',wood:'🪵',materials:'🪚',money:'💵',power:'⚡',medicine:'➕'}
  const NAMES = {food:'Food',water:'Water',wood:'Wood',medicine:'Medicine'}
  const col = val<=20?'#ef4444':val<=40?'#f59e0b':'#4ade80'

  return `<div class="rc-inner">
    <div class="rc-header">
      <span class="rc-icon">${ICONS[k]}</span>
      <span class="rc-name">${NAMES[k]}</span>
      <span class="rc-val" style="color:${col}">${val}</span>
      <span class="rc-trend" style="color:${trendCol}">${trend}</span>
    </div>
    <div class="rc-bar-wrap"><div class="rc-bar-fill" style="width:${val}%;background:${col}"></div></div>
    <div class="rc-status">${statusLine}</div>
    ${mentionHtml}
  </div>`
}

function toggleResCard(k) {
  const card = document.getElementById('res-card')
  if (!card) return
  document.querySelectorAll('.res-pill').forEach(p=>p.classList.remove('rp-active'))
  if (_activeRes === k) {
    card.classList.remove('open')
    _activeRes = null
    return
  }
  _activeRes = k
  document.querySelector(`.res-pill[data-key="${k}"]`)?.classList.add('rp-active')
  card.innerHTML = buildResCardContent(k)
  card.classList.add('open')
}

function renderResHud() {
  const hud = document.getElementById('res-hud')
  if(!hud) return
  const res = S.world.resources || {}
  const items = [
    {k:'food', icon:'🥫'},
    {k:'water', icon:'💧'},
    {k:'wood', icon:'🪵'},
    {k:'materials', icon:'🪚'},
    {k:'money', icon:'💵'},
    {k:'power', icon:'⚡'}
  ]
  hud.innerHTML = items.map(({k, icon}) => {
    const v = res[k] ?? '—'
    const col = typeof v==='number' ? (v<=20?'#ef4444':v<=40?'#f59e0b':'rgba(255,255,255,.55)') : 'rgba(255,255,255,.3)'
    return `<div class="res-pill" data-key="${k}" onclick="toggleResCard('${k}')"><span class="res-pill-icon">${icon}</span><span class="res-pill-val" style="color:${col}">${v}</span></div>`
  }).join('') + `<div id="res-card"></div>`
  // Re-open active card if it was open before re-render
  if (_activeRes) {
    const card = document.getElementById('res-card')
    if (card) { card.innerHTML = buildResCardContent(_activeRes); card.classList.add('open') }
    document.querySelector(`.res-pill[data-key="${_activeRes}"]`)?.classList.add('rp-active')
  }
}

// blush, mouth) with -${cid} ids matching the main characters' geometry, so applyFace
// drives real expressions on any dynamically-added character (born child, etc.).
// ── PERSON MODEL ────────────────────────────────────────────
// Reads S.chars[cid].appearance { skin, hair{style,color}, accessory, outfit }
// and renders a distinct little person. Falls back to sensible defaults so it
// never throws when appearance is missing. The face rig (brows, eyes-*, blush,
// mouth ids + geometry) is preserved verbatim so applyFace/FACES keep working,
// and the feet ellipses (cy=-1) are untouched so characters stay grounded.

    case 'short': // neat rounded cap with a side part

    case 'bangs': // rounded cap + a clear scalloped fringe coming down over the forehead + length at the sides

    case 'long': // straight hair falling past the shoulders, behind the body

        <path d="M -14 -58 C -15 -74 -8.5 -86 0 -86 C 8.5 -86 15 -74 14 -58" fill="none" stroke="#00000026" stroke-width="1"/>

    case 'cap': // baseball cap: rounded crown hugging the head + forward brim

        <path d="M -11.8 -75.5 L -18 -73.5 C -16.5 -70.5 -8.5 -71.5 -2.5 -74.5 Z" fill="${COL_CAP}"/>
        <path d="M -10 -78 C -6 -86 6 -86 10 -78" fill="none" stroke="#00000022" stroke-width="1"/>
      </g>`
    case 'beanie': // knitted cap pulled low over the crown + fold band
      return `<g>

        <rect x="-12.2" y="-75.5" width="24.4" height="4" rx="2" fill="${COL_CAP}" stroke="#00000026" stroke-width=".7"/>
      </g>`
    case 'headphones': // band over the crown + ear cups
      return `<g>
        <path d="M -12 -72 C -13 -86 13 -86 12 -72" fill="none" stroke="#1f2430" stroke-width="2.4"/>
        <rect x="-14" y="-75" width="4.5" height="7" rx="2" fill="#1f2430"/>
        <rect x="9.5" y="-75" width="4.5" height="7" rx="2" fill="#1f2430"/>

    case 'earrings': // tiny studs at the jaw line

        <circle cx="-10.5" cy="-65" r="1.3" fill="#fcd34d"/>
        <circle cx="10.5" cy="-65" r="1.3" fill="#fcd34d"/>
      </g>`
    case 'none': default:
      return ''
  }
}

function makeGenericCharSVG(cid, color, skin) {
  color = color || '#a78bfa'
  const ap = (S.chars && S.chars[cid] && S.chars[cid].appearance) || {}
  skin = ap.skin || skin || '#e3b68e'
  const hc = (ap.hair && ap.hair.color) || '#2b2118'
  const hairStyle = (ap.hair && ap.hair.style) || 'short'
  const acc = ap.accessory || 'none'
  const outfit = ap.outfit || color
  const accColor = ap.accColor || ''
  const pants = ap.pants || '#3c4150'      // trousers (data-driven per character)
  const boots = ap.boots || '#2c2118'      // jungle boots
  const hair = hairSVG(hairStyle, hc)
  const accFront = accessorySVG(acc, hc, outfit, accColor)
  // headwear replaces the hair-on-top look; keep front hair only when bare-headed
  const hairFront = (acc === 'hood' || acc === 'cap' || acc === 'beanie') ? '' : hair.front
  // soft skin shade (a touch darker) for cheek/jaw AO
  const shade = '#00000016'

  // ── LIVING WEAR: dirt, stubble, sweat, rips grow with days + condition ──
  // All client-derived from data Haiku already produces (day + scores) — zero engine cost.
  const day = (S.world && S.world.day) || 1
  const sc = (S.chars && S.chars[cid] && S.chars[cid].scores) || {}
  const condition = (S.chars && S.chars[cid] && (S.chars[cid].condition || S.chars[cid].ailment)) || 'healthy'
  const injured = condition === 'injured' || condition === 'sick' || condition === 'hurt'
  let wear = Math.min(1, (day - 1) / 11)                       // ramps over ~11 days
  if ((sc.energy ?? 100) < 40) wear = Math.min(1, wear + .14)  // exhaustion shows
  if ((sc.health ?? 100) < 60) wear = Math.min(1, wear + .20)  // run-down/sick shows
  const beard = ap.beard ? Math.min(1, (day - 1) / 7) : 0      // stubble→beard (opt-in)
  const gm = (b) => Math.max(0, Math.min(.82, b + wear * .58)).toFixed(2)  // grime opacity
  const gl = Array.isArray(ap.gear) ? ap.gear : String(ap.gear || '').split('+').filter(Boolean)
  const has = g => gl.includes(g)

  // gear drawn BEHIND the torso (backpack hump peeking past the shoulders)
  const gearBack = has('backpack') ? `
