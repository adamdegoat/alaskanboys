  happy:      {l:-14,r:14, tail:'wag'},
  smitten:    {l:-14,r:14, tail:'wag'},
  flirtatious:{l:-10,r:10, tail:'wag'},
  hopeful:    {l:-12,r:12, tail:'slow'},
  calm:       {l:-4, r:4,  tail:'slow'},
  neutral:    {l:0,  r:0,  tail:'slow'},
  guarded:    {l:14, r:-14,tail:'none'},
  jealous:    {l:14, r:-14,tail:'none'},
  embarrassed:{l:8,  r:-8, tail:'low'},
  sad:        {l:20, r:-20,tail:'tuck'},
  heartbroken:{l:24, r:-24,tail:'tuck'},
  angry:      {l:28, r:-28,tail:'none'},
  shocked:    {l:32, r:-32,tail:'tuck'},
  lustful:    {l:-8, r:8,  tail:'slow'},
}
function applyAnimalExtras(cid, fk){
  const p = ANIMAL_POSE[fk] || ANIMAL_POSE.neutral
  const el = document.getElementById('ear-l-'+cid); const er = document.getElementById('ear-r-'+cid)
  if(el) el.style.transform = `rotate(${p.l}deg)`
  if(er) er.style.transform = `rotate(${p.r}deg)`
  const tail = document.getElementById('tail-'+cid)
  if(tail){
    tail.classList.remove('wag','slow')
    tail.style.transform = ''
    if(p.tail==='wag') tail.classList.add('wag')
    else if(p.tail==='slow') tail.classList.add('slow')
    else if(p.tail==='tuck') tail.style.transform = 'rotate(48deg)'
    else if(p.tail==='low') tail.style.transform = 'rotate(24deg)'
  }
}

function ensureCharDom(cid) {
  const c = S.chars[cid] || {}
  const color = c.color || '#a78bfa'
  const isDog = (c.species||'human') !== 'human'
  // Signature of everything that affects the drawn art. If the avatar already exists
  // but its look changed — or `appearance` only arrived AFTER the first build (a
  // load-order / CDN race meant the first render had no appearance) — rebuild just
  // the SVG art in place. Without this, the art is frozen at first creation and a
  // later data update (e.g. Judy's beanie) never shows. updateWorld re-applies
  // face/pose immediately after, so the rebuilt avatar picks those back up.
  // Include day + condition + low-stat flags so living wear (dirt/stubble/sweat/bandage)
  // re-renders the figure as the days pass or a character gets hurt/run-down.
  const _sc = c.scores || {}
  const wearSig = isDog ? '' : `|d${(S.world&&S.world.day)||1}|${c.condition||c.ailment||'ok'}|e${(_sc.energy??100)<40?1:0}|h${(_sc.health??100)<60?1:0}`
  const sig = JSON.stringify(c.appearance || {}) + '|' + (isDog ? 'dog' : 'human') + wearSig
  const existing = document.getElementById('char-'+cid)
  if(existing){
    if(existing.dataset.appSig === sig) return
    const art = existing.querySelector('svg.char-svg')
    const fresh = isDog ? makeAnimalSVG(cid) : makeGenericCharSVG(cid, color)
    if(art) art.outerHTML = fresh
    existing.dataset.appSig = sig
    return
  }
  const firstName = c.name ? c.name.split(' ')[0].toUpperCase() : ''
  const div = document.createElement('div')
  div.className = 'char'
  div.id = 'char-' + cid
  div.dataset.appSig = sig
  div.innerHTML =
    (isDog ? makeAnimalSVG(cid) : makeGenericCharSVG(cid, color)) +
    `<div class="nametag" id="nametag-${cid}" style="color:${color};border:1px solid ${color}33">${firstName}</div>` +
    `<div class="bubble" id="bubble-${cid}" style="border-top:2px solid ${color}80">` +
      (firstName ? `<div class="bubble-name" id="bubblename-${cid}" style="color:${color}">${firstName}</div>` : `<div class="bubble-name" id="bubblename-${cid}" style="color:${color}"></div>`) +
      `<div class="bubble-text" id="thought-${cid}"></div>` +
    `</div>` +
    `<div class="stat-card" id="sc-${cid}"></div>`   // populated by buildStatCard; hover (desktop) / tap (mobile, via delegated handler)
  document.getElementById('world').appendChild(div)
}

function updateWorld() {
  const w=S.world
  document.getElementById('day-label').textContent='Day '+(w.day||1)
  document.getElementById('cycle-label').textContent=cap(w.cycle||'')
  document.getElementById('ds-day').textContent='Day '+(w.day||1)
  document.getElementById('ds-cycle').textContent=cap(w.cycle||'')
  if(w.pulse){
    const p=document.getElementById('pulse'); p.textContent=w.pulse
    const age=relAgo(latestFeedTs())
    if(age){ const s=document.createElement('span'); s.className='pulse-age'; s.textContent=' · '+age; p.appendChild(s) }
  }
  positionSceneLine()

  const CHARS=Object.keys(S.chars)
  CHARS.forEach(cid=>ensureCharDom(cid))
  setHudVar()  // refresh --stage-bottom BEFORE laying out, so positions use the correct stage height
  // Keep the background SVG + structures shifted in lock-step with the character math.
  // The SVG element is sized to the FULL scaled art height (not just the stage) so its own
  // viewport never clips the ocean; --world-shift then slides it up under #world's clip.
  const _scale=Math.max(window.innerWidth/1000, stageH()/600)
  const _svg=document.getElementById('world-svg')
  if(_svg) _svg.style.height=(600*_scale)+'px'
  document.documentElement.style.setProperty('--world-shift', (-worldYOffset(stageH(), _scale))+'px')
  const W=isMobile()?getWorldWidth():window.innerWidth, H=stageH()
  // compute raw pixel positions
  const positions=CHARS.map(cid=>{
    const c=S.chars[cid]||{}
    const {left,top}=toPos(c.location?.x||50,c.location?.y||50,c.location?.waypoint)
    const px=parseFloat(left)/100*W
    const py=parseFloat(top)/100*H
    return {id:cid, px, py}
  })
  separateChars(positions)

  positions.forEach(p=>{
    const el=document.getElementById('char-'+p.id); if(!el) return
    el.style.left=(p.px/W*100)+'%'
    el.style.top=(p.py/H*100)+'%'
    applyFace(p.id)
    updateBubble(p.id)
    // keep nametag/bubble label in sync (so an unnamed stray's tag appears once it's named)
    const nm = S.chars[p.id]?.name ? S.chars[p.id].name.split(' ')[0].toUpperCase() : ''
    const ntag = document.getElementById('nametag-'+p.id); if(ntag && ntag.textContent!==nm) ntag.textContent = nm
    const blab = document.getElementById('bubblename-'+p.id); if(blab && blab.textContent!==nm) blab.textContent = nm
  })

  nudgeBubbles(positions)
  renderInteractions(positions)
  renderChat()
  updateStatusBar()
  updateStatCards()
  renderStructures()
  renderResHud()
  updateFireChip()
  renderCampStores()
  renderVehicleState()

  if(isMobile() && !mobileScrollInited) {
    mobileScrollInited = true
    requestAnimationFrame(() => {
      // Center the horizontal scroll on the CAST (their average position), not the world's
      // geometric midpoint — so wherever the camp sits in the scene, the characters land in
      // view. Falls back to the geometric center if no characters are positioned yet.
      const W = getWorldWidth(), vw = window.innerWidth
      const maxX = Math.max(0, W - vw)
      const cs = Object.keys(S.chars||{}).map(cid=>{
        const el=document.getElementById('char-'+cid)
        return el ? el.offsetLeft + el.offsetWidth/2 : null
      }).filter(v=>v!=null)
      const focus = cs.length ? cs.reduce((a,b)=>a+b,0)/cs.length : W*0.5
      const target = Math.round(Math.min(maxX, Math.max(0, focus - vw/2)))
      // Scroll whichever element actually owns the horizontal overflow (window on real
      // mobile; document.body when html isn't the scroller) so centering is browser-proof.
      window.scrollTo(target, 0)
      const se = document.scrollingElement || document.documentElement
      if(se) se.scrollLeft = target
      document.body.scrollLeft = target
    })
  }
}

// ── STARS CANVAS ─────────────────────────────────────────
function drawStars(active) {
  const c=document.getElementById('stars')
  if(!active){c.style.opacity='0';return}
  c.width=getWorldWidth();c.height=window.innerHeight*.34
  const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height)
  for(let i=0;i<200;i++){
    const x=(Math.sin(i*137.5)*.5+.5)*c.width
    const y=(Math.sin(i*97.3)*.5+.5)*c.height
    const r=Math.sin(i*43.1)*.4+1.1
    const a=Math.sin(i*61.7)*.35+.75
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2)
    ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fill()
  }
}


const ALL_STEPS=['morning','midday','afternoon','evening','night']

function cap(s){return s?s[0].toUpperCase()+s.slice(1):''}
// Relative "time ago" from an SGT-naive ISO timestamp (correct for any visitor timezone).
function tsToMs(ts){const m=String(ts||'').match(/(\d+)-(\d+)-(\d+)T(\d+):(\d+)(?::(\d+))?/);return m?Date.UTC(+m[1],+m[2]-1,+m[3],+m[4]-8,+m[5],+m[6]||0):null}
function relAgo(ts){const ms=tsToMs(ts);if(ms==null)return '';let d=Date.now()-ms;if(d<0)d=0;const mn=Math.floor(d/60000);if(mn<1)return 'just now';if(mn<60)return mn+' min ago';const h=Math.floor(mn/60);if(h<24)return h+'h ago';const dd=Math.floor(h/24);return dd===1?'yesterday':dd+' days ago'}
function latestFeedTs(){const lr=[...(S.feed||[])].reverse().find(e=>e&&e.type!=='birth');return lr?lr.timestamp:null}

let S={chars:{},feed:[],world:{}}

async function reloadData(){
  const t=Date.now()
  try {
    const [c,f,w]=await Promise.all([
      fetch('data/characters.json?t='+t).then(r=>r.json()),
      fetch('data/feed.json?t='+t).then(r=>r.json()),
      fetch('data/world.json?t='+t).then(r=>r.json()),
    ])
    // Only re-render when a NEW cycle has actually been written — avoids needless
    // re-layout (and feed-scroll yanks) every poll when nothing changed.
    const changed = !S.world || w.last_cycle_key !== S.world.last_cycle_key
      || (f && S.feed && f.length !== S.feed.length)
    S.chars=c;S.feed=f;S.world=w
    if(changed) updateWorld()
    // Even when no new cycle, pick up any changed character looks (cheap: ensureCharDom
    // no-ops when the appearance signature is unchanged). Heals a first-render that
    // happened before appearance data was available.
    else Object.keys(S.chars).forEach(ensureCharDom)
  } catch(e){ /* transient fetch error — keep showing current state, try again next poll */ }
}
// Pick up new cycles automatically (data changes ~5x/day; poll is cheap and no-op when unchanged)
setInterval(reloadData, 120000)

// Auto-update when a NEW build of this page is deployed. GitHub Pages caches the HTML
// (max-age=600) so code/art changes (e.g. character looks) can otherwise sit behind a
// stale tab until a manual hard-refresh. This records the served Last-Modified of the
// page on load and reloads once if a newer build appears — no manual refresh needed.
let _buildStamp = null
async function checkForNewBuild(){
  try{
    const r = await fetch(location.pathname + '?_b=' + Date.now(), {method:'HEAD', cache:'no-store'})
    const stamp = r.headers.get('last-modified') || r.headers.get('etag')
    if(!stamp) return
    if(_buildStamp && stamp !== _buildStamp){ location.reload() }
    _buildStamp = _buildStamp || stamp
  }catch(e){ /* offline / transient — try again next tick */ }
}
checkForNewBuild()
setInterval(checkForNewBuild, 120000)

const SC_COLORS = {marcus:'#93c5fd',ryan:'#fde68a',jade:'#f9a8d4',judy:'#99f6e4'}
const SC_FILL   = {marcus:'#60a5fa',ryan:'#fbbf24',jade:'#f472b6',judy:'#2dd4bf'}
const SCORE_LABELS = ['trust','openness','loneliness','resilience','ambition']
const SURVIVAL_LABELS = ['hunger','thirst','energy','health']
// survival bars are colour-coded by level: green (ok) / amber (low) / red (critical)
function survColor(v){ return v>=60?'#4ade80' : v>=30?'#fbbf24' : '#f87171' }
function getScColor(cid){return SC_COLORS[cid]||(S.chars[cid]?.color||'#94a3b8')}
function getScFill(cid){return SC_FILL[cid]||S.chars[cid]?.color||'#94a3b8'}

function buildStatCard(cid) {
  const el = document.getElementById('sc-'+cid)
  if(!el || !S.chars[cid]) return
  const c = S.chars[cid]
  const col = getScColor(cid)
  const s = c.scores || {}

  // ── A "character snapshot" for visitors: who they are + how they're doing, in plain words ──
  // identity: their bio's first sentence (strip a leading "35, ", cap the length)
  let bio = (c.bio||'').trim().replace(/^\d+,\s*/,'')
  bio = (bio.split(/(?<=[.!?])\s+/)[0] || bio)
  if(bio.length>132) bio = bio.slice(0,129).replace(/\s+\S*$/,'')+'…'
  if(bio) bio = bio.charAt(0).toUpperCase()+bio.slice(1)

  // "right now": current mood + a plain physical read (high hunger/thirst = fed/hydrated)
  const cond = c.condition || c.ailment
  let condIcon='', condTxt=''
  if(cond==='injured'||cond==='hurt'){ condIcon='🤕'; condTxt='injured, mending' }
  else if(cond==='sick'){ condIcon='🤒'; condTxt='sick, recovering' }
  else {
    const issues=[]
    if((s.health??100)<50) issues.push('worn down')
    if((s.energy??100)<35) issues.push('exhausted')
    if((s.hunger??100)<40) issues.push('hungry')
    if((s.thirst??100)<40) issues.push('parched')
    condTxt = issues.length ? (issues.length===1?issues[0]:issues.slice(0,-1).join(', ')+' and '+issues.slice(-1)) : 'holding up'
  }
  const nowLine = `${condIcon?condIcon+' ':''}${cap(c.mood||'—')} — ${condTxt}`

  // "nature": 2-3 plain traits from the strongest personality scores
  const traitDefs = [['resilience','Tough','Easily shaken'],['openness','Open','Guarded'],['trust','Trusting','Suspicious'],['ambition','Driven','Laid-back']]
  const traits = traitDefs.map(([k,hi,lo])=>{ const v=s[k]; if(v==null) return null; const d=Math.abs(v-50); if(d<12) return null; return {w:v>=50?hi:lo, d} }).filter(Boolean)
  if((s.loneliness??0)>62) traits.push({w:'Lonely', d:s.loneliness-50})
  traits.sort((a,b)=>b.d-a.d)
  const nature = traits.slice(0,3).map(t=>t.w).join(' · ')

  // "bonds": relationships in plain language (notable ones)
  const bondLine = (rel,name)=>{
    const a=rel.attraction??0, t=rel.tension??0, cl=rel.closeness??0
    if(a>=25 && cl>=50) return `💛 Close with ${name}`
    if(a>=25) return `💛 Drawn to ${name}`
    if(t>=40) return `⚡ At odds with ${name}`
    if(cl>=55) return `🤝 Close with ${name}`
    if(cl<=25) return `· Distant from ${name}`
    return `· Getting to know ${name}`
  }
  const bondsHtml = Object.keys(S.chars).filter(k=>k!==cid).map(oid=>{
    const rel = c.relationships?.[oid]; if(!rel) return ''
    const oName = S.chars[oid]?.tag || (S.chars[oid]?.name||cap(oid)).split(' ')[0]
    return `<div class="sc-bond">${bondLine(rel, oName)}</div>`
  }).filter(Boolean).join('')

  const role = `${c.age?c.age+' · ':''}the ${cap(c.archetype||'survivor')}`
  el.style.border = `1px solid ${col}33`
  el.innerHTML = `
    <div class="sc-name" style="color:${col}">${c.name||cap(cid)}</div>
    <div class="sc-role">${role}</div>
    ${bio ? `<div class="sc-bio">${bio}</div>` : ''}
    <div class="sc-line"><span class="sc-key">Right now</span><span class="sc-now">${nowLine}</span></div>
    ${nature ? `<div class="sc-line"><span class="sc-key">Nature</span><span class="sc-now">${nature}</span></div>` : ''}
    ${bondsHtml ? `<div class="sc-bonds">${bondsHtml}</div>` : ''}
  `

  // auto-flip horizontal + vertical based on character screen position
  const charEl = document.getElementById('char-'+cid)
  if(charEl) {
    const xPct = parseFloat(charEl.style.left||'50')
    const yPct = parseFloat(charEl.style.top||'50')
    el.classList.toggle('left', xPct > 55)
    el.classList.toggle('right', xPct <= 55)
    el.classList.toggle('below', yPct < 40)
  }
}

function updateStatCards() {
  Object.keys(S.chars).forEach(buildStatCard)
}

function showDayHistoryChips() {
  const inner = document.getElementById('dhp-inner')
  if(!inner || !S.world) return
  const w = S.world
  const WX = {clear:'☀️',rain:'🌧️',storm:'⛈️',overcast:'☁️',foggy:'🌫️'}
  const CYNAME = {morning:'Morning',midday:'Midday',afternoon:'Afternoon',evening:'Evening',night:'Night'}
  const allDays = [...new Set((S.feed||[]).map(e=>e.day))].sort((a,b)=>b-a)
  if(!allDays.includes(w.day)) allDays.unshift(w.day)
  inner.innerHTML = `
    <div class="dhp-head">Jungle History</div>
    <div class="dhp-scroll"><div class="dhp-chips">
      ${allDays.map(d => {
        const isCur = d === w.day
        const meta = isCur ? `${CYNAME[w.cycle]||''} ${WX[w.weather]||''}`.trim() : ''
        return `<div class="dhp-chip${isCur?' cur':''}" onclick="showDayHistorySummary(${d})">
          ${isCur?'<span class="dhp-dot"></span>':''}<span>Day ${d}</span>
          ${meta?`<span class="dhp-chip-meta">${meta}</span>`:''}
        </div>`
      }).join('')}
    </div></div>`
}

function showDayHistorySummary(day) {
  const inner = document.getElementById('dhp-inner')
  if(!inner) return
  // Prefer the whole-day recap (written at the night cycle). If the day is still in
  // progress, say so. Older days from before this feature fall back to the last event.
  const summ = S.world?.day_summaries?.[day]
  const isCurrent = day === (S.world?.day)
  let bodyHtml
  if (summ) {
    bodyHtml = `<div class="dhp-drama">${summ}</div>`
  } else if (isCurrent) {
    bodyHtml = `<div class="dhp-ongoing">Day ${day} is still unfolding — the full recap arrives at day's end.</div>`
  } else {
    const entries = (S.feed||[]).filter(e=>e.day===day)
    const interactions = entries.filter(e=>e.type==='interaction')
    const lastIntr = interactions[interactions.length-1]
    const dramaLine = lastIntr?.description
      || [...entries].reverse().find(e=>e.thought)?.thought || '—'
    bodyHtml = `<div class="dhp-drama">"${dramaLine}"</div>`
  }
  inner.innerHTML = `
    <div class="dhp-head">
      <span>Day ${day}</span>
      <button class="dhp-back" onclick="showDayHistoryChips()">← all days</button>
    </div>
    <div class="dhp-scroll">
      ${bodyHtml}
    </div>`
}

// Scene line: the "overnight → now" recap that sits directly under the LATEST headline.
// Position is MEASURED from the headline's real rendered bottom (never hardcoded) so it
// stays glued under it on every screen size and however many lines the headline wraps to.
function positionSceneLine(){
  const pulse = document.getElementById('pulse')
  const pr = pulse?.getBoundingClientRect()
  let blockBottom = (pr && pr.bottom) ? pr.bottom : 32
  const el = document.getElementById('scene-line')
  if(el){
    const txt = (S && S.world && S.world.scene) || ''
    el.textContent = txt
    if(!txt){ el.style.display='none' }
    else {
      el.style.display=''
      // sit just below the headline; fall back to a sane top if it isn't laid out yet
      el.style.top = (blockBottom + 6) + 'px'
    }
  }
  // (resource pills now live bottom-right via CSS — no headline-tucking needed)
}

function setHudVar(){
  const hud = document.getElementById('hud')
  const h = hud?.getBoundingClientRect().height
  if(h) document.documentElement.style.setProperty('--above-hud', (Math.ceil(h)+12)+'px')
  // --stage-bottom: the full-width bottom chrome (HUD + COLLAPSED feed drawer) the world
  // must sit above so the beach/ocean stays visible. Always reserve the drawer's COLLAPSED
  // footprint — even when it's expanded — so opening/closing the drawer never resizes the
  // world (its CSS `bottom` offset is unchanged when open; only its height grows).
  const DRAWER_COLLAPSED = 44
  let top = window.innerHeight
  if(hud) top = Math.min(top, hud.getBoundingClientRect().top)
  const chat = document.getElementById('chat-panel')
  if(chat){
    const chatTop = chat.classList.contains('feed-open')
      ? window.innerHeight - (parseFloat(getComputedStyle(chat).bottom)||0) - DRAWER_COLLAPSED
      : chat.getBoundingClientRect().top
    top = Math.min(top, chatTop)
  }
  const sb = Math.max(0, Math.round(window.innerHeight - top))
  if(sb) document.documentElement.style.setProperty('--stage-bottom', sb+'px')
}
window.addEventListener('resize', ()=>{ setHudVar(); if(S && Object.keys(S.chars||{}).length) updateWorld() })

// ── ZOOM-AWARE RE-SYNC (mobile pinch-zoom) ──────────────────────────────────
// Mobile browsers (esp. iOS Safari) let users pinch-zoom even though our viewport asks them
// not to. The fixed UI + horizontal map-scroll were built assuming no zoom, so after a zoom
// in/out things could be left "stuck" (stale layout, scroll jammed past the world edge).
// When a zoom settles (scale returns toward 1) — or on any visual-viewport change — we
// re-measure + re-lay-out (same path as a resize) and clamp the map-scroll back into bounds,
// so nothing stays stuck once the gesture ends. (Additive: only runs on visualViewport
// events, so the normal no-zoom layout is untouched.)
if (window.visualViewport) {
  const vv = window.visualViewport
  let vvRaf = null
  const syncViewport = () => {
    vvRaf = null
    setHudVar()
    if (S && Object.keys(S.chars||{}).length) updateWorld()
    if (isMobile()) {
      const maxX = Math.max(0, getWorldWidth() - window.innerWidth)
      const x = Math.min(maxX, Math.max(0, currentWorldScrollX()))
      if (x !== currentWorldScrollX()) scrollWorldX(x)
    }
  }
  const onVV = () => { if (!vvRaf) vvRaf = requestAnimationFrame(syncViewport) }
  vv.addEventListener('resize', onVV)
  vv.addEventListener('scroll', onVV)
}
// Keep --above-hud and --stage-bottom in sync with the HUD's REAL height at all times.
// On mobile the HUD wraps to extra rows (and grows as status text / fonts change), so a
// one-time measure goes stale: the Oracle button (z-index 52) ends up under the HUD
// (z-index 100) and the world stage height drifts. A ResizeObserver re-measures on every
// HUD size change, then re-lays-out the world so characters track the new stage height.
const _hudEl = document.getElementById('hud')
if(_hudEl && window.ResizeObserver){
  new ResizeObserver(()=>{ setHudVar(); if(S && Object.keys(S.chars||{}).length) updateWorld() }).observe(_hudEl)
}

setInterval(updateStatusBar,60000)
init().then(()=>{ initTapStats(); setHudVar() });

// One-time invite: gently nudge first-time visitors toward the full story archive (with day recaps).
;(function(){
  const btn=document.getElementById('story-btn'); if(!btn) return
  const KEY='rimba_storyBtnSeen'
  if(!localStorage.getItem(KEY)){ btn.classList.add('nudge'); setTimeout(()=>btn.classList.remove('nudge'),14000) }
  btn.addEventListener('click',()=>{ localStorage.setItem(KEY,'1'); btn.classList.remove('nudge') })
})()

// ── AUDIENCE VOTING ("sway, don't script") ──────────────────────────────────
const VOTE_URL='https://wuorljdhcucldqqeqlvy.supabase.co';
const VOTE_KEY='sb_publishable_fUl9AURQ3Mp0OblCKoFkWQ_8qLW-UiA';
const VOTE_WORLD='rimba';
let _vote=null;
function voterId(){let v=localStorage.getItem('rimba_voter');if(!v){v='v'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('rimba_voter',v);}return v;}
async function loadVote(){ try{_vote=await fetch('data/vote.json?t='+Date.now()).then(r=>r.json());}catch{_vote=null;} renderVote(); }
async function renderVote(){
  const body=document.getElementById('vp-body'); if(!body) return;
  if(!_vote||!_vote.poll){ body.innerHTML='<div style="color:rgba(255,255,255,.5);font-size:12px">No vote open right now — check back soon.</div>'; return; }
  const poll=_vote.poll, opts=poll.options||[];
  const myPick=localStorage.getItem('rimba_voted_'+poll.id);
  let tally={};
  try{ const rows=await fetch(VOTE_URL+'/rest/v1/rpc/tally',{method:'POST',headers:{apikey:VOTE_KEY,Authorization:'Bearer '+VOTE_KEY,'Content-Type':'application/json'},body:JSON.stringify({w:VOTE_WORLD,p:poll.id})}).then(r=>r.json()); rows.forEach(r=>tally[r.choice]=r.n); }catch{}
  const total=Object.values(tally).reduce((a,b)=>a+(+b||0),0);
  let html=`<div class="vp-q">${poll.question||'Which way should the camp lean?'}</div>`;
  opts.forEach(o=>{
    const n=+tally[o.id]||0, pct=total?Math.round(n/total*100):0, picked=myPick===o.id;
    html+=`<button class="vp-opt${picked?' picked':''}" ${myPick?'disabled':''} onclick="castVote('${o.id}')">
      <div class="vp-bar" style="width:${myPick?pct:0}%"></div>
      <div class="vp-opt-label">${o.label}</div><div class="vp-opt-desc">${o.desc||''}</div>
      ${myPick?`<div class="vp-opt-pct">${pct}%</div>`:''}</button>`;
  });
  html+= myPick
    ? `<div class="vp-voted">✓ You leaned toward ${(opts.find(o=>o.id===myPick)||{}).label||myPick} · ${total} ${total===1?'voice':'voices'} so far</div>`
    : `<div class="vp-hint">Tap to cast your one vote — it closes tonight.</div>`;
  const ip=_vote.in_play;
  if(ip) html+=`<div class="vp-inplay">In play now · <b>${ip.label}</b> — ${ip.desc}.${ip.votes?` Chosen by ${ip.votes} ${ip.votes===1?'watcher':'watchers'}.`:''} The camp leans this way today.</div>`;
  else html+=`<div class="vp-inplay">No lean is in play yet — <b>tonight's vote sets tomorrow's mood.</b></div>`;
  body.innerHTML=html;
}
async function castVote(choice){
  const poll=_vote&&_vote.poll; if(!poll||localStorage.getItem('rimba_voted_'+poll.id)) return;
  try{ const res=await fetch(VOTE_URL+'/rest/v1/votes',{method:'POST',headers:{apikey:VOTE_KEY,Authorization:'Bearer '+VOTE_KEY,'Content-Type':'application/json'},body:JSON.stringify({world:VOTE_WORLD,poll_id:poll.id,choice,voter:voterId()})});
    if(res.ok||res.status===409) localStorage.setItem('rimba_voted_'+poll.id,choice); }catch{}
  renderVote();
}
function toggleVote(){
  const panel=document.getElementById('vote-panel'), pill=document.getElementById('vote-pill');
  const willOpen=!panel.classList.contains('open');
  // one corner-panel at a time: close the Days dropdown if it's open
  if(willOpen && typeof _dhpOpen!=='undefined' && _dhpOpen){
    _dhpOpen=false; document.getElementById('day-history-panel')?.classList.remove('open');
    document.getElementById('day-hist-btn')?.classList.remove('active');
  }
  panel.classList.toggle('open', willOpen);
  pill.classList.toggle('active', willOpen);
  if(willOpen) loadVote();
}
// tap anywhere outside the dropdown (or the pill) closes it
document.addEventListener('click', e=>{
  const panel=document.getElementById('vote-panel');
  if(panel && panel.classList.contains('open') && !e.target.closest('#vote-panel') && !e.target.closest('#vote-pill')){
    panel.classList.remove('open'); document.getElementById('vote-pill')?.classList.remove('active');
  }
});
loadVote();
</script>
</body>
